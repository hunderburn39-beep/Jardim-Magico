<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Faraó Eterno: os segredos da eternidade. Jogo egípcio original com 10 linhas, símbolos expansivos e Free Spins.">
  <title>Faraó Eterno — Os Segredos da Eternidade</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" as="image" href="assets/temple.webp">
  <link rel="stylesheet" href="style.css?v=1.0.2">
  <script defer src="js/engine.js?v=1.0"></script>
  <script defer src="js/session.js?v=1.0"></script>
  <script defer src="js/game.js?v=1.0.10"></script>
  <script defer src="js/effects.js?v=1.0"></script>
  <script defer src="js/audio.js?v=1.0"></script>
  <script defer src="js/visual-v11.js?v=1.1.4"></script>
  <script defer src="js/cinematic-v12.js?v=1.2.0"></script>
</head>
<body>
  <main id="game" aria-label="Faraó Eterno">
    <div id="stage">
      <canvas id="canvas" role="img" aria-label="Cinco tambores, três posições e dez linhas disponíveis. Usa os botões para jogar." tabindex="-1"></canvas>
      <nav id="touch-controls" aria-label="Controlos do jogo"></nav>
      <div id="screen-msg" role="status" aria-live="polite" class="sr-only"></div>
      <div id="session-lock" class="session-lock hidden" role="alertdialog" aria-modal="true" aria-label="Sessão atualizada">
        <section><h2>O teu legado continua noutra janela</h2><p>A sessão foi atualizada. Recarrega para continuar com o saldo mais recente.</p><button class="btn" id="reload-session">Recarregar sessão</button></section>
      </div>
    </div>
    <div id="modal" class="modal hidden" aria-hidden="true">
      <section class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="close-modal" class="close" aria-label="Fechar">×</button>
        <h2 id="modal-title">Faraó Eterno</h2>
        <div id="modal-content"></div>
      </section>
    </div>
    <aside class="rotate-hint">Roda o telemóvel para jogar na vertical.</aside>
  </main>
  <noscript>Ativa o JavaScript para entrar no templo do Faraó Eterno.</noscript>
</body>
</html>
