function enemyPalette(bank){
 const id=ROM_PALETTE_RECORDS[bank],hex=ROM_ENEMY_PALETTES[bank];
 if(!hex||hex.length!==64)return null;
 const captured=Uint16Array.from({length:16},(_,i)=>parseInt(hex.slice(i*4,i*4+4),16));
 const native=id===undefined?null:window.StrikersSpriteDefinitions?.palette(id);

const romEnemyCache=new Map();

function romEnemySprite(name,variant=0){
 const skins=ROM_ENEMY_SKINS[name],rom=window.StrikersROM;
 if(!skins||!rom?.isLoaded())return null;
 const skin=skins[variant%skins.length],key=skin.code+'-'+skin.nx+'-'+skin.ny+'-'+skin.pal;
 if(romEnemyCache.has(key))return romEnemyCache.get(key);
 const pal=enemyPalette(skin.pal);
 if(!pal)return null;
 // Rotate MAME's 16px hardware tiles 90 degrees, preserving their real proportions.
 const descriptor=window.StrikersSpriteDefinitions?.get(skin.code);
 const cols=descriptor?.nx??skin.nx,rows=descriptor?.ny??skin.ny;
 const can=document.createElement('canvas');
 if(!window.StrikersSpriteDefinitions?.drawRaw(can,skin.code,cols,rows,pal))return null;
 if(romEnemyCache.size>60)romEnemyCache.clear();
 romEnemyCache.set(key,can);return can;
}

}

  const kind=w.style||'fire';
  if(kind==='electric'){ // electric forked corona
   ctx.strokeStyle='#dcfbff';ctx.lineWidth=1.4;
   for(let k=0;k<9;k++){
    const a=k*TAU/9+totalTime*.5;
    ctx.beginPath();ctx.moveTo(w.x+Math.cos(a)*r*.42,w.y+Math.sin(a)*r*.42);
    ctx.lineTo(w.x+Math.cos(a+.13)*r*.8,w.y+Math.sin(a+.13)*r*.8);
    ctx.lineTo(w.x+Math.cos(a)*r*1.25,w.y+Math.sin(a)*r*1.25);ctx.stroke();
   }
  }else if(kind==='plasma'){ // radial green petals
   ctx.fillStyle='#b7ffa973';
   for(let k=0;k<8;k++){
    const a=k*TAU/8+progress;
    ctx.beginPath();ctx.ellipse(w.x+Math.cos(a)*r*.67,w.y+Math.sin(a)*r*.67,
     2.8+f*2,7.5*f+1,a,0,TAU);ctx.fill();
   }
  }else if(kind==='heavy'||kind==='heavyRing'){ // broad red shockwave and hot fragments
   ctx.strokeStyle='#fff4b8b6';ctx.lineWidth=3*f;
   ctx.beginPath();ctx.arc(w.x,w.y,r*.75,0,TAU);ctx.stroke();
   ctx.strokeStyle='#e858555a';ctx.lineWidth=5*f;
   ctx.beginPath();ctx.arc(w.x,w.y,r*1.22,0,TAU);ctx.stroke();
  }else{ // flame tongues / orange sparks
   ctx.strokeStyle='#fff6d1';ctx.lineWidth=1.5;
   for(let k=0;k<7;k++){let a=k*TAU/7+progress;
    ctx.beginPath();ctx.moveTo(w.x+Math.cos(a)*r*.7,w.y+Math.sin(a)*r*.7);
    ctx.lineTo(w.x+Math.cos(a)*r*1.45,w.y+Math.sin(a)*r*1.45);ctx.stroke();
   }
  }
  ctx.restore();
 }
}

// the user's own chips; the correspondence between sprite ID and plane type
// remains an explicit, provisional research mapping until code-table verification.
const ROM_PLAYER_MAP_KEY='strikers1945_plane_asset_candidates_v1';
const ROM_PLAYER_NAMES=['p38','spitfire','zero','p51'];
let romPlayerMap=null,romPlayerCache=new Map(),playerArtError=false;
function safeOriginalPlayer(id,bank=0,time=0){
 if(playerArtError)return null;
 try{return window.StrikersOriginalPlayers?.sprite(id,bank,time)??null}catch(err){playerArtError=true;console.warn('Original player sprite data:',err);return null}
}
function nativePlayerSprite(craft,bankAmount=0,time=0){
 if(!window.StrikersROM?.isLoaded())return null;
 // Use the verified original frame sequence; palette assignment remains provisional.
 const original=safeOriginalPlayer(ROM_PLAYER_NAMES[craft],bankAmount,time);
 if(original)return original;
 if(romPlayerMap===null){try{romPlayerMap=JSON.parse(localStorage.getItem(ROM_PLAYER_MAP_KEY)||'{}')}catch(e){romPlayerMap={}}}
 const spec=romPlayerMap[ROM_PLAYER_NAMES[craft]];
 if(!spec||!Number.isInteger(spec.code)||spec.code<0||spec.code>131071)return null;
 const nx=spec.nx|0,ny=spec.ny|0,bank=String(spec.bank);
 if(nx<1||nx>8||ny<1||ny>8||!(bank in ROM_ENEMY_PALETTES))return null;
 const key=[spec.code,nx,ny,bank].join(':');
 if(romPlayerCache.has(key))return romPlayerCache.get(key);
 const palHex=ROM_ENEMY_PALETTES[bank];if(!palHex||palHex.length!==64)return null;
 const pal=new Uint16Array(16);
 for(let i=0;i<16;i++)pal[i]=parseInt(palHex.slice(i*4,i*4+4),16);
 const canvas=document.createElement('canvas');canvas.width=ny*16;canvas.height=nx*16;
 const c=canvas.getContext('2d'),im=c.createImageData(canvas.width,canvas.height),p=im.data;
 for(let ty=0;ty<ny;ty++)for(let tx=0;tx<nx;tx++)for(let py=0;py<16;py++)for(let px=0;px<16;px++){
  const id=(spec.code+ty*nx+tx)&131071,v=window.StrikersROM.rawPixel('sprite',id,px,py,true);
  if(v===15)continue;
  const col=pal[v],x=ty*16+py,y=nx*16-1-(tx*16+px),o=(y*canvas.width+x)*4;
  p[o]=((col>>10)&31)*255/31|0;p[o+1]=((col>>5)&31)*255/31|0;p[o+2]=(col&31)*255/31|0;p[o+3]=255;
 }
 c.putImageData(im,0,0);romPlayerCache.set(key,canvas);return canvas;
}

 }

  circle(ctx,player.x,player.y-6,4,'#ffffff');
 }
 ctx.restore();
}for(let p of sparks){const fade=clamp(p.life/p.max,0,1);ctx.globalAlpha=fade*(p.kind==='smoke'?.43:1);
if(p.kind==='smoke')circle(ctx,p.x,p.y,p.r*(1.5+(1-fade)*1.8),p.c);
else{ctx.strokeStyle=p.c;ctx.lineWidth=Math.max(.7,p.r*.6);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke();if(p.r>2)circle(ctx,p.x,p.y,p.r*.55,'#fff2c6')}}ctx.globalAlpha=1;for(let f of floats){ctx.globalAlpha=1-f.t/.8;if(f.medal&&window.StrikersOriginalEffects?.drawMedalScore(ctx,f.medal,f.t,f.x,f.y))continue;ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillStyle='#ffdd88';ctx.shadowColor='#001521';ctx.shadowBlur=4;ctx.fillText(f.label,f.x,f.y)}ctx.globalAlpha=1;if(flash){ctx.fillStyle=`rgba(255,233,191,${flash*.48})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
