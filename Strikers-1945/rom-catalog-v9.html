<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strikers 1945 — catálogo ROM V9</title><style>body{background:#181c23;color:#eee;font:14px system-ui;margin:14px}button,input,select{font:inherit;padding:8px}header{position:sticky;top:0;background:#181c23;padding:8px 0;z-index:1}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}figure{margin:0;background:#272d35;min-height:115px;display:grid;place-items:center;border-radius:5px;padding:6px}canvas{image-rendering:pixelated;max-width:100%;max-height:110px}figcaption{font:11px monospace;text-align:center;color:#ccc}p{color:#bcd}a{color:#aee}</style><header><h2>Catálogo de sprites originais</h2><input id="file" type="file" accept=".zip"><p id="status">Importa o ZIP World original.</p><label>Paleta <select id="palette"><option value="-1">Cinzento (pré-visualização)</option></select></label><label> Índice <input id="offset" type="number" min="0" max="4673" value="0" style="width:75px"></label><button id="prev">◀</button><button id="next">▶</button><p>As cores são da ROM quando escolhida uma paleta; a associação a cada sprite ainda não está confirmada.</p></header><div id="grid"></div><script src="./original-rom.js"></script><script src="./rom-sprite-definitions.js"></script><script>
const $=id=>document.getElementById(id);let defs=[];
for(let i=0;i<516;i++){const o=document.createElement('option');o.value=i;o.textContent=i+' · '+(0x1b944+i*32).toString(16);$('palette').append(o)}
function render(){
 const start=Math.min(Math.max(0,Number($('offset').value)||0),Math.max(0,defs.length-1));$('offset').value=start;
 const pal=window.StrikersSpriteDefinitions.palette(Number($('palette').value));const frag=document.createDocumentFragment();
 for(const e of defs.slice(start,start+80)){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');window.StrikersSpriteDefinitions.draw(c,e.code,pal);cap.textContent=e.code+' · '+e.nx+'×'+e.ny+' · '+e.address.toString(16);f.append(c,cap);frag.append(f)}
 $('grid').replaceChildren(frag);$('status').textContent=defs.length+' definições · '+start+'–'+Math.min(start+79,defs.length-1);
}
function ready(){try{defs=window.StrikersSpriteDefinitions.all();if(defs.length)render()}catch(e){$('status').textContent=e.message}}
$('file').onchange=async e=>{try{await window.StrikersROM.load(e.target.files[0]);ready()}catch(err){$('status').textContent=err.message}};
$('offset').onchange=render;$('palette').onchange=render;$('prev').onclick=()=>{$('offset').value=Math.max(0,Number($('offset').value)-80);render()};$('next').onclick=()=>{$('offset').value=Math.min(defs.length-1,Number($('offset').value)+80);render()};
window.addEventListener('strikers-rom-ready',ready);if(window.StrikersROM.isLoaded())ready();
</script></html>
