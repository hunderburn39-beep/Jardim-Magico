<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strikers 1945 — catálogo de mapas ROM</title><style>body{background:#111923;color:#f4f4f4;font:16px system-ui;margin:20px}main{max-width:1000px;margin:auto}h1{font-size:22px}label{display:block;margin:12px 0}select,input{max-width:100%;font:inherit}select{padding:8px;background:#27394a;color:white}#art{overflow:auto;background:repeating-conic-gradient(#30373c 0% 25%,#22272b 0% 50%) 50%/24px 24px;min-height:120px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;margin:auto}#status,#details{overflow-wrap:anywhere}a{color:#b1dbff}</style></head><body><main><h1>Catálogo técnico de cenários · V9.3</h1><p>Mapas e cores descodificados do ZIP original, sem inventar a posição ou velocidade de cada camada.</p><a href="./index.html">Voltar ao jogo</a><label>ROM original <input id="file" type="file" accept=".zip"></label><p id="status" role="status">Escolhe a ROM original.</p><label>Cenário <select id="scene" disabled></select></label><label>Camada <select id="layer" disabled><option value="0">Lista 0</option><option value="1">Lista 1</option></select></label><label>Paleta <select id="variant" disabled><option value="0">Variante 0</option><option value="1">Variante 1</option></select></label><label>Bloco <select id="block" disabled></select></label><p id="details"></p><div id="art"></div></main><script src="./original-rom.js"></script><script src="./rom-sprite-definitions.js?v=9.3"></script><script src="./rom-map-blocks.js?v=9.3.6"></script><script>
const el=id=>document.getElementById(id),maps=window.StrikersOriginalMaps,rom=window.StrikersROM;
function opt(select,n,label){const o=document.createElement('option');o.value=n;o.textContent=label;select.append(o)}
function blocks(){el('block').replaceChildren();const sc=maps.scenes()[+el('scene').value];sc.mapLists[+el('layer').value].forEach((r,i)=>{if(!r)return;const m=maps.get(r.group,r.id);opt(el('block'),i,'Bloco '+r.group+':'+r.id+' · '+m.width+' × '+m.columns+' tiles');});paint()}
function paint(){try{const scene=+el('scene').value,layer=+el('layer').value,i=+el('block').value,variant=+el('variant').value;const c=maps.renderBlock(scene,layer,i,variant);if(!c)throw Error('Bloco indisponível');el('art').replaceChildren(c);el('details').textContent=c.width+' × '+c.height+' píxeis nativos; posicionamento no cenário ainda não validado.'}catch(e){el('status').textContent=e.message}}
function ready(){try{const a=maps.auditScenePalettes();if(!a)return;el('status').textContent=a.references+' referências · '+a.bankChecks+' verificações de bancos';el('scene').replaceChildren();for(const sc of maps.scenes())opt(el('scene'),sc.id,'Registo '+sc.id+' · 0x'+sc.address.toString(16));for(const id of ['scene','layer','variant','block'])el(id).disabled=false;blocks()}catch(e){el('status').textContent=e.message}}
el('scene').onchange=blocks;el('layer').onchange=blocks;el('variant').onchange=paint;el('block').onchange=paint;el('file').onchange=async()=>{try{if(el('file').files[0])await rom.load(el('file').files[0]);ready()}catch(e){el('status').textContent=e.message}};window.addEventListener('strikers-rom-ready',ready);if(rom.isVerified())ready();else rom.restore?.().then(ready).catch(()=>{});
</script></body></html>
