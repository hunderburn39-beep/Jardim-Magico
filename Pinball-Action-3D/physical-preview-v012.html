// Each control has independent owners. Losing one finger, key or pointer
// cannot release a button still held by another input source.
const held=new Map();
function changeInputSource(map,k,source,on){
 let owners=map.get(k);
 if(on){if(!owners){owners=new Set();map.set(k,owners)}if(owners.has(source))return null;const first=owners.size===0;owners.add(source);return first?true:null;}
 if(!owners||!owners.delete(source))return null;
 if(owners.size===0){map.delete(k);return false}return null;
}
function showHeld(k,on){for(const b of document.querySelectorAll('[data-key]'))if(b.dataset.key===k)b.classList.toggle('held',on)}
function input(k,source,on){
 if(!ready)return;if(on&&(contextLost||!entered||!$('gate').hidden))return;
 const edge=changeInputSource(held,k,source,on);if(edge===null)return;
 if(edge)controls.unlock();
 controls.input(k,edge);showHeld(k,edge);
}
for(const b of document.querySelectorAll('[data-key]')){
 const k=b.dataset.key;
 if('PointerEvent' in window){
  b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}input(k,'p:'+e.pointerId,true)});
  for(const n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,e=>{input(k,'p:'+e.pointerId,false)});
 }else{
  b.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)input(k,'t:'+t.identifier,true)},{passive:false});
  for(const n of ['touchend','touchcancel'])b.addEventListener(n,e=>{e.preventDefault();for(const t of e.changedTouches)input(k,'t:'+t.identifier,false)},{passive:false});
  b.addEventListener('mousedown',e=>{if(e.button===0)input(k,'mouse',true)});
 }
}
if(!('PointerEvent' in window))window.addEventListener('mouseup',()=>{for(const k of [...held.keys()])input(k,'mouse',false)});
const keys={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'launch',ArrowUp:'shake',KeyC:'coin',Digit1:'start',Digit2:'start2',Enter:'start'};
window.addEventListener('keydown',e=>{const k=keys[e.code];if(k&&entered&&$('gate').hidden){e.preventDefault();if(!e.repeat)input(k,'k:'+e.code,true)}});
window.addEventListener('keyup',e=>{if(keys[e.code])input(keys[e.code],'k:'+e.code,false)});
function release(){for(const [k,owners] of [...held.entries()])for(const source of [...owners])input(k,source,false);document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'))}
