name: "GitHub Pages | Publicar jogos e Strikers 1945"

on:
  push:
    branches: [main]
    paths:
      - 'Strikers-1945/**'
      - '.github/workflows/publicar-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-completo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter todos os jogos do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar site completo (preservar todos os jogos)
        run: |
          mkdir -p _site
          rsync -r --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' --exclude='node_modules/' --exclude='__pycache__/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/Strikers-1945/index.html
          test -s _site/Strikers-1945/stage1-captured.html
          test -s _site/Strikers-1945/stage1-captured-catalog.js
          test -s _site/Strikers-1945/original-rom.js
          test -s _site/Strikers-1945/stage1-plane-frames.b64
          echo "A publicar $(find _site -type f | wc -l) ficheiros (todos os projetos preservados)."
          du -sh _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publicar ficheiros como artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy do site inteiro
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar que Strikers 1945 e catálogo abrem sem erro 404
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for file in Strikers-1945/index.html Strikers-1945/stage1-captured.html Strikers-1945/stage1-captured-catalog.js; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl --location --silent --output /tmp/strikers-page-check --write-out '%{http_code}' "${SITE_URL%/}/${file}?source=${GITHUB_SHA}" || true)
              echo "${file}: HTTP ${code:-000} (tentativa ${attempt})"
              if [ "${code}" = "200" ] && [ -s /tmp/strikers-page-check ]; then ok=1;break;fi
              sleep 3
            done
            if [ "${ok}" -ne 1 ]; then
              echo "::error::${file} não está publicado (HTTP 200 em falta)"
              exit 1
            fi
          done
          echo "Strikers e catálogo disponíveis: HTTP 200"
