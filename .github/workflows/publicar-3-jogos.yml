name: "Publicar no GitHub Pages | 4 jogos"

# O GitHub Pages oferece um unico site por repositorio.
# Por isso publicamos os quatro jogos juntos, em pastas separadas,
# sem deixar que a publicacao de um substitua os outros.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index2.html'
      - 'Sugar-Rush-1000/standalone/**'
      - 'Sugar-Rush-1000/frontend/**'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'jardim-phaser/**'
      - 'stake-preview/**'
      - 'jardim-3d/**'
      - 'templo-do-trovao/**'
      - 'Farao-Eterno/**'
      - 'Halloween/**'
      - 'Raspadinha-100X/**'
      - '.github/workflows/publicar-3-jogos.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-quatro-jogos-pages
  # Uma publicação nova substitui automaticamente a anterior que ficou presa.
  cancel-in-progress: true

jobs:
  preparar:
    name: Verificar e preparar os quatro jogos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter todas as pastas
        uses: actions/checkout@v4

      - name: Instalar pnpm para o frontend original (opcional)
        continue-on-error: true
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
          run_install: false

      - name: Preparar Node.js (frontend opcional)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Sugar-Rush-1000/frontend/pnpm-lock.yaml

      - name: Converter os doces originais em PNG transparente (opcional)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q pillow
          python3 Sugar-Rush-1000/frontend/scripts/prepare_art.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          base = Path('Sugar-Rush-1000/frontend/public/images/candies')
          for i in range(7):
              with Image.open(base / f'candy_{i}.png') as im:
                  assert im.format == 'PNG' and im.mode == 'RGBA', i
                  assert im.getchannel('A').getextrema()[1] == 255, i
          print('7 simbolos HD reais, em PNG RGBA, preparados.')
          PY

      - name: Compilar frontend Phaser original com imagens e audio (opcional)
        continue-on-error: true
        working-directory: Sugar-Rush-1000/frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          test -s dist/index.html
          test -s dist/images/candies/candy_0.png
          test -s dist/images/candies/scatter.png
          test -s dist/audio/music_default.mp3
          echo "Frontend original compilado com imagens e som."

      - name: Garantir que os quatro jogos estão presentes
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s index2.html
          test -s Sugar-Rush-1000/standalone/index.html
          test -s Sugar-Rush-1000/standalone/engine.js
          test -s Sugar-Rush-1000/standalone/game.js
          test -s Sugar-Rush-1000/standalone/style.css
          test -s jardim-phaser/index.html
          test -s stake-preview/index.html
          test -s jardim-phaser/vendor/phaser-3.90.0.min.js
          test -s templo-do-trovao/index.html
          test -s Farao-Eterno/index.html
          test -s Halloween/index.html
          test -s Halloween/js/engine.js
          test -s Halloween/js/game.js
          test -s Halloween/js/art.js
          test -s Raspadinha-100X/index3.html
          test -d css
          test -d js
          test -d assets
          echo "Todos os quatro jogos existem."

      - name: Criar único site, com pastas independentes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html public/index.html
          cp index2.html public/index2.html
          cp -a css js assets public/
          cp -a jardim-phaser jardim-3d public/
          cp -a stake-preview public/
          cp -a templo-do-trovao Farao-Eterno Halloween Raspadinha-100X public/
          mkdir -p public/Sugar-Rush-1000
          cp -a Sugar-Rush-1000/standalone public/Sugar-Rush-1000/
          mkdir -p public/Sugar-Rush-1000/play
          if test -s Sugar-Rush-1000/frontend/dist/index.html \
             && test -s Sugar-Rush-1000/frontend/dist/images/candies/candy_0.png \
             && test -s Sugar-Rush-1000/frontend/dist/images/candies/scatter.png \
             && test -s Sugar-Rush-1000/frontend/dist/audio/music_default.mp3; then
            cp -a Sugar-Rush-1000/frontend/dist/. public/Sugar-Rush-1000/play/
            echo "Sugar Rush frontend compilado foi incluído no Pages."
          else
            echo "::warning::Build opcional Sugar Rush indisponível; manter jogo standalone e criar acesso alternativo."
            cat > public/Sugar-Rush-1000/play/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sugar Rush 1000</title><meta http-equiv="refresh" content="0;url=../standalone/">
          </head><body><p><a href="../standalone/">Abrir Sugar Rush 1000</a></p></body></html>
          EOF
          fi
          touch public/.nojekyll
          test -s public/index.html
          test -s public/jardim-phaser/index.html
          test -s public/stake-preview/index.html
          test -s public/templo-do-trovao/index.html
          test -s public/Farao-Eterno/index.html
          test -s public/Halloween/index.html
          test -s public/Halloween/js/art.js
          test -s public/Raspadinha-100X/index3.html
          test -s public/index2.html
          test -s public/Sugar-Rush-1000/standalone/index.html
          test -s public/Sugar-Rush-1000/play/index.html
          echo "Jardim Mágico: /jardim-phaser/"
          echo "Portões do Trovão: /templo-do-trovao/"
          echo "Faraó Eterno: /Farao-Eterno/"
          echo "Halloween: /Halloween/"
          echo "Raspadinha 100X: /Raspadinha-100X/index3.html"
          echo "Sugar Rush original Phaser offline: /index2.html"

      - name: Validar JavaScript do Stake Preview sem mexer nos outros jogos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('stake-preview/index.html').read_text()
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          assert 'function generate(mode)' in script
          assert 'function holdFeature()' in script
          assert 'function freeFeature()' in script
          Path('/tmp/jardim-stake-preview.js').write_text(script)
          PY
          node --check /tmp/jardim-stake-preview.js
          node stake-preview/tests/hold-probabilities.mjs
          node stake-preview/tests/visual-events.mjs
          node stake-preview/tests/history-replay.mjs
          node stake-preview/tests/audio-assets.mjs
          node stake-preview/tests/intro-bonus.mjs
          node stake-preview/tests/paytable.mjs
          node stake-preview/tests/wild-multipliers.mjs
          node stake-preview/tests/hold-continue.mjs
          echo 'Stake preview: JS válido, 10 000 compras Hold e animações verificadas.'

      - name: Validar música e recursos do Faraó Eterno antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          test -s public/Farao-Eterno/assets/pharaohs-ritual.mp3
          test -s public/Farao-Eterno/assets/bonus-ritual.mp3
          node --check public/Farao-Eterno/js/ambient-loop.js
          node --check public/Farao-Eterno/js/feature-ui-v134.js
          node --check public/Farao-Eterno/js/intro-flow.js
          node Farao-Eterno/tests/audio-flow.cjs
          echo "Faraó Eterno: ambos MP3, Free Spins e música normal validados."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Guardar os quatro jogos num só artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publicar:
    name: Publicar sem apagar os outros jogos
    needs: preparar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o site com os quatro jogos
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar Stake Preview (sem bloquear futuras versões)
        continue-on-error: true
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/stake-preview/?sha=${GITHUB_SHA}"
          for tentativa in {1..8}; do
            if curl -fLsS --max-time 15 --connect-timeout 8 "$url" -o /tmp/jm-stake-preview-public.html \
               && grep -Eq 'Stake Preview V0\.[0-9]+' /tmp/jm-stake-preview-public.html \
               && grep -q 'id="skipBtn"' /tmp/jm-stake-preview-public.html \
               && grep -q 'id="paylineSvg"' /tmp/jm-stake-preview-public.html \
               && curl -fLsS --max-time 15 "${SITE_URL%/}/assets/imagens/jm38-caracol.svg" -o /tmp/jm-stake-simbolo.svg; then
              echo "JARDIM STAKE CONFIRMADO no GitHub Pages: HTML, PASSAR, linhas e símbolo original."
              exit 0
            fi
            echo "Stake Preview: verificação ${tentativa}/8..."
            sleep 5
          done
          echo "::warning::Stake Preview indisponível ou sem elementos essenciais."
          exit 1

      - name: Confirmar que Halloween deixou de apresentar 404
        continue-on-error: true
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/Halloween/"
          echo "A confirmar publicação de: $url"
          for tentativa in {1..8}; do
            if curl -fLsS --max-time 20 --connect-timeout 10 "$url?sha=${GITHUB_SHA}" -o /tmp/halloween-publicado.html \
                && grep -q 'js/engine.js' /tmp/halloween-publicado.html \
                && curl -fLsS --max-time 20 "$url/js/engine.js?sha=${GITHUB_SHA}" -o /tmp/halloween-engine.js \
                && grep -q 'HalloweenEngine' /tmp/halloween-engine.js \
                && curl -fLsS --max-time 20 "$url/js/art.js?sha=${GITHUB_SHA}" -o /tmp/halloween-art.js \
                && grep -q 'HalloweenArt' /tmp/halloween-art.js \
                && curl -fLsS --max-time 20 "$url/js/game.js?sha=${GITHUB_SHA}" -o /tmp/halloween-game.js \
                && grep -q 'Phaser.Game' /tmp/halloween-game.js; then
              echo "Halloween disponível online: HTML e os três ficheiros JS confirmados (HTTP 200)."
              exit 0
            fi
            echo "Tentativa ${tentativa}/8: ainda não está acessível."
            sleep 10
          done
          echo "::warning::O site Halloween continua indisponível. Verificar Settings > Pages > Build and deployment > Source = GitHub Actions."
          exit 1

      - name: Confirmar Raspadinha 100X online
        continue-on-error: true
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/Raspadinha-100X/index3.html"
          for tentativa in {1..12}; do
            if curl -fLsS --max-time 20 "$url?sha=${GITHUB_SHA}" -o /tmp/raspadinha-publicada.html \
               && grep -q 'const PRICE=100' /tmp/raspadinha-publicada.html \
               && grep -q 'startScratchSound' /tmp/raspadinha-publicada.html; then
              echo "Raspadinha 1 euro, 100x e som acessivel online: HTTP 200"
              exit 0
            fi
            echo "Raspadinha: tentativa ${tentativa}/12."
            sleep 10
          done
          echo "::warning::Raspadinha indisponivel ou versao desatualizada no GitHub Pages."
          exit 1
