name: "Publicar no GitHub Pages | 4 jogos"

# O GitHub Pages oferece um unico site por repositorio.
# Por isso publicamos os quatro jogos juntos, em pastas separadas,
# sem deixar que a publicacao de um substitua os outros.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'jardim-phaser/**'
      - 'jardim-3d/**'
      - 'templo-do-trovao/**'
      - 'Farao-Eterno/**'
      - 'Halloween/**'
      - '.github/workflows/publicar-3-jogos.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-quatro-jogos-pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Verificar e preparar os quatro jogos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter todas as pastas
        uses: actions/checkout@v4

      - name: Garantir que os quatro jogos estão presentes
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s jardim-phaser/index.html
          test -s jardim-phaser/vendor/phaser-3.90.0.min.js
          test -s templo-do-trovao/index.html
          test -s Farao-Eterno/index.html
          test -s Halloween/index.html
          test -s Halloween/js/engine.js
          test -s Halloween/js/game.js
          test -d css
          test -d js
          test -d assets
          echo "Todos os quatro jogos existem."

      - name: Criar único site, com pastas independentes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html public/index.html
          cp -a css js assets public/
          cp -a jardim-phaser jardim-3d public/
          cp -a templo-do-trovao Farao-Eterno Halloween public/
          touch public/.nojekyll
          test -s public/index.html
          test -s public/jardim-phaser/index.html
          test -s public/templo-do-trovao/index.html
          test -s public/Farao-Eterno/index.html
          test -s public/Halloween/index.html
          echo "Jardim Mágico: /jardim-phaser/"
          echo "Portões do Trovão: /templo-do-trovao/"
          echo "Faraó Eterno: /Farao-Eterno/"
          echo "Halloween: /Halloween/"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Guardar os quatro jogos num só artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publicar:
    name: Publicar sem apagar os outros jogos
    needs: preparar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o site com os quatro jogos
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar que Halloween deixou de apresentar 404
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/Halloween/"
          echo "A confirmar publicação de: $url"
          for tentativa in {1..8}; do
            if curl -fLsS --max-time 20 --connect-timeout 10 "$url?sha=${GITHUB_SHA}" -o /tmp/halloween-publicado.html \
                && grep -qi 'HALLOWEEN' /tmp/halloween-publicado.html; then
              echo "Halloween disponível online (HTTP 200 e HTML correto)."
              exit 0
            fi
            echo "Tentativa ${tentativa}/8: ainda não está acessível."
            sleep 10
          done
          echo "::error::O site Halloween continua indisponível. Verificar Settings > Pages > Build and deployment > Source = GitHub Actions, e erros do deploy-pages."
          exit 1
