name: "Halloween | Testes independentes"

on:
  push:
    branches: [main]
    paths:
      - 'Halloween/**'
      - '.github/workflows/testar-halloween.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Halloween/**'
      - '.github/workflows/testar-halloween.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halloween-testes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar-halloween:
    name: Verificar Halloween
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar ficheiros e JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s Halloween/index.html
          test -s Halloween/js/engine.js
          test -s Halloween/js/game.js
          test -s Halloween/js/art.js
          test -s Halloween/tests/ui-smoke.test.cjs
          test -s Halloween/tests/browser.cjs
          grep -q 'js/art.js' Halloween/index.html
          test -s jardim-phaser/vendor/phaser-3.90.0.min.js
          grep -q 'jardim-phaser/vendor/phaser-3.90.0.min.js' Halloween/index.html
          for file in Halloween/js/*.js; do node --check "$file"; done

      - name: Testar matemática e bónus
        run: node --test Halloween/tests/engine.test.cjs

      - name: Testar interface Phaser sem dependências externas
        run: node --test Halloween/tests/ui-smoke.test.cjs

      - name: Preparar pacote autónomo de execução
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Halloween dist/jardim-phaser/vendor
          cp -a Halloween/. dist/Halloween/
          cp jardim-phaser/vendor/phaser-3.90.0.min.js dist/jardim-phaser/vendor/
          (cd dist && zip -q -r ../Halloween-V0.13.zip Halloween jardim-phaser)
          test -s Halloween-V0.13.zip

      - name: Guardar pacote para testes
        uses: actions/upload-artifact@v4
        with:
          name: Halloween-V0.13
          path: Halloween-V0.13.zip
          if-no-files-found: error

      - name: Instalar Playwright para Chromium e Safari/WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Iniciar servidor HTTP local
        shell: bash
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/halloween-http.log 2>&1 &
          for n in {1..15}; do
            if curl -fsS http://127.0.0.1:8124/Halloween/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/halloween-http.log
          exit 1

      - name: Testar interface, giro e bónus em Chromium e WebKit
        run: node Halloween/tests/browser.cjs

      - name: Guardar capturas visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halloween-testes-visuais
          path: visual-previews/
          if-no-files-found: ignore
