name: Conferir apresentação Jardim Phaser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-phaser.yml'
      - 'jardim-phaser/tests/visual.mjs'
      - 'jardim-phaser/css/cenario-v35.css'
      - 'jardim-phaser/css/polimento-v37.css'
      - 'jardim-phaser/css/icones-v38.css'
      - 'jardim-phaser/css/materiais-v39.css'
      - 'jardim-phaser/js/material-v39.js'
      - 'jardim-phaser/js/art-presentation-v37.js'
      - 'assets/imagens/jm40-moeda-magica.svg'
      - 'jardim-phaser/js/reels.js'
      - 'jardim-phaser/js/spin-motion-v391.js'
      - 'jardim-phaser/js/cascade-fx-v41.js'
      - 'jardim-phaser/js/coin-values-v42.js'
      - 'jardim-phaser/js/coin-face-v422.js'
      - 'jardim-phaser/js/reels.js'
      - 'jardim-phaser/css/moedas-porco-v42.css'
      - 'assets/imagens/jm42-moeda-sem-numero.svg'
      - 'assets/imagens/jm38-*.svg'
      - 'jardim-phaser/js/art-presentation-v37.js'
      - 'jardim-phaser/js/reels.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de testes
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Servir jogo real
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/jardim-http.log 2>&1 &
          sleep 2
      - name: Validar e fotografar três ecrãs
        run: node jardim-phaser/tests/visual.mjs
      - name: Montagem dos ficheiros antigos de arte
        if: always()
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          paths=list(Path('assets/imagens').glob('*.png'))+list(Path('assets/imagens').glob('*.webp'))
          paths=sorted(paths,key=lambda p:p.name)
          W,H=300,245
          art=Image.new('RGB',(W*4,H*((len(paths)+3)//4)),'#182431')
          d=ImageDraw.Draw(art)
          for i,p in enumerate(paths):
              try:
                  im=Image.open(p).convert('RGBA');im.thumbnail((W-20,H-38))
                  tile=Image.new('RGBA',im.size,(41,51,68,255))
                  tile.alpha_composite(im)
                  x=(i%4)*W+(W-im.width)//2;y=(i//4)*H+8
                  art.paste(tile.convert('RGB'),(x,y))
                  d.text(((i%4)*W+10,(i//4)*H+H-27),p.name[:38],fill='white')
              except Exception as exc: print('skip',p,exc)
          Path('visual-previews').mkdir(exist_ok=True)
          art.save('visual-previews/art-library.png')
          PY
      - name: Guardar comparações visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-v42-visual
          path: visual-previews/
          if-no-files-found: ignore
