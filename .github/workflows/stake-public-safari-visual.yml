name: Stake Preview | Safari na página publicada
on:
  push:
    branches: [main]
    paths:
      - 'stake-preview/tests/public-safari-visual.py'
      - '.github/workflows/stake-public-safari-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir-safari-publico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador Safari WebKit
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps webkit
      - name: Validar imagens e tambores no site publicado
        run: python stake-preview/tests/public-safari-visual.py
      - name: Guardar captura do Safari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stake-safari-publico
          path: stake-safari-public.png
          if-no-files-found: ignore
          retention-days: 7
