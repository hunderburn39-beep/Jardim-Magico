name: "Strikers 1945 | Reconstrução ROM completa V7.1 e testes"
on:
  push:
    branches: [main]
    paths:
      - 'Strikers-1945/index.html'
      - 'Strikers-1945/remake.html'
      - 'Strikers-1945/original-rom.js'
      - 'Strikers-1945/inspector.html'
      - 'Strikers-1945/arcade.html'
      - 'Strikers-1945/sw.js'
      - 'Strikers-1945/stage1-flight-replay.js'
      - 'Strikers-1945/stage1-background.js'
      - 'Strikers-1945/tests/**'
      - '.github/workflows/strikers-1945.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar servidor HTML5 local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/strikers-server.log 2>&1 &
      - name: Testar gráfícos, gestos para baixo, botões e execução
        run: node Strikers-1945/tests/smoke.mjs
      - name: Validar 4 armamentos, mísseis e trajetórias laterais
        run: node Strikers-1945/tests/weapons.mjs
      - name: Auditar posições reais, trajetórias e reutilização dos registos de sprites
        run: node Strikers-1945/tests/trajectory-audit.mjs
      - name: Validar colisões, proteção e tamanho real dos aviões
        run: node Strikers-1945/tests/combat.mjs
      - name: Validar controlo tátil relativo no iPhone
        run: node Strikers-1945/tests/touch-v6.mjs
      - name: Testar importação privada da ROM e reconstrução dos seis cenários
        run: node Strikers-1945/tests/rom-import.mjs
      - name: Validar original Arcade com Service Worker e ROM local
        run: node Strikers-1945/tests/arcade-mode.mjs
      - name: Disponibilizar código do remake para validação local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strikers1945-v70-site
          path: Strikers-1945/
          retention-days: 3
      - name: Guardar imagem de verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strikers1945-v70-previews
          path: |
            strikers-v2-preview.png
            strikers-v6-touch.png
            strikers-weapon-*.png
            strikers-explosion-*.png
            strikers-rom-mode.png
            strikers-v42-background.png
            strikers-v42-sprites.png
            strikers-v52-enemies.png
            strikers-arcade-mode.png
          if-no-files-found: ignore
