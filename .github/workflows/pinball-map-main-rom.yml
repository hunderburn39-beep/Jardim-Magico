name: Pinball Action - rastrear comandos reais da ROM principal
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pinball-map-main-rom.yml'
permissions:
  contents: read
jobs:
  rom-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rastrear audio emitido pela CPU principal original
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('Pinball-Action/index.html','utf8');
          const rom=JSON.parse(html.split('window.PB_ROM=')[1].split(';</script>')[0]);
          const st=html.indexOf('const FS = 0x80'),ed=html.indexOf('</script>',st);
          const sandbox={Uint8Array,Array,console};
          vm.runInNewContext(html.slice(st,ed),sandbox,{timeout:5000});
          const mem=Uint8Array.from(atob(rom.snapshot),c=>c.charCodeAt(0));
          const state=JSON.parse(rom.state);
          for(const scenario of [
            {label:'TITLE_IDLE',duration:2100,coin:false,start:false},
            {label:'COIN_ONLY',duration:600,coin:true,start:false},
            {label:'COIN_AND_START',duration:700,coin:true,start:true}
          ]){
            const m=Uint8Array.from(atob(rom.snapshot),c=>c.charCodeAt(0));
            let frame=0;
            const events=[],cpu=new sandbox.PBZ80(m,state,{sound:(cmd)=>{
              events.push({frame,cmd,pc:cpu.pc.toString(16),scroll:cpu.scroll});
              if(events.length<=90)console.log('SOUND',scenario.label,frame,cmd,cpu.pc.toString(16));
            }});
            let lastScroll=cpu.scroll;
            for(frame=0;frame<scenario.duration;frame++){
              cpu.io.system=scenario.coin && frame>=3&&frame<18?1:scenario.start&&frame>=35&&frame<54?4:0;
              cpu.io.p1=scenario.start&&frame>=90&&frame<112?1:0;
              for(let k=0;k<6500;k++){if(cpu.halt)break;cpu.step();}
              cpu.nmi();
              if(cpu.scroll!==lastScroll && frame%10===0)console.log('SCROLL',scenario.label,frame,cpu.scroll);
              lastScroll=cpu.scroll;
            }
            const counts={};for(const e of events)counts[e.cmd]=(counts[e.cmd]||0)+1;
            console.log('SUMMARY',scenario.label,JSON.stringify({n:events.length,counts,first:events.slice(0,25),last:events.slice(-12),scroll:cpu.scroll,credits:m[0xc013]}));
          }
          JS
