name: Pinball Action - publicar sons originais da ROM

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pinball-action-audio.yml
      - Pinball-Action/tools/render-original-audio.cjs

permissions:
  contents: write

concurrency:
  group: pinball-action-audio
  cancel-in-progress: false

jobs:
  original-mp3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar e verificar o codificador MP3
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          node --version
          ffmpeg -version | head -1
      - name: Gerar MP3 usando ROM Z80 e os tres AY-3-8910 originais
        run: node Pinball-Action/tools/render-original-audio.cjs
      - name: Validar os MP3 produzidos
        run: |
          node - <<'JS'
          const fs=require('fs'),path=require('path');
          const dir='Pinball-Action/audio';
          const data=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'));
          const list=Object.values(data.commands);
          if(list.length<25)throw Error('Faltam efeitos da ROM');
          for(const item of list){
            const file=path.join(dir,item.file);
            const bytes=fs.readFileSync(file);
            if(bytes.length<1000 || !(bytes.toString('ascii',0,3)==='ID3'||bytes[0]===255))
              throw Error('MP3 invalido: '+file);
          }
          console.log('Validado:',list.length,'efeitos de audio da ROM.');
          JS
      - name: Publicar audio original
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pinball-Action/audio/
          if git diff --cached --quiet; then
            echo "Sons originais ja publicados."
          else
            git commit -m "Pinball Action: publicar efeitos MP3 extraidos da ROM original"
            git push
          fi
