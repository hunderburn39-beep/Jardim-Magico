name: Importar quatro figuras 3D originais (temporario)
on:
  push:
    branches: [stake-4-figuras-3d-aprovadas-20261114]
permissions:
  contents: write
jobs:
  importar-quatro-figuras:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transferir PNGs originais sem editar ou comprimir
        env:
          SOURCE_BASE: https://sb-1zos93fej7el.vercel.run
        run: |
          set -euo pipefail
          mkdir -p stake-preview/assets/figuras-3d-aprovadas-20261114
          for name in bule cogumelo caracol pedra; do
            curl --fail --location --retry 5 --retry-delay 2 --max-time 100 \
              "$SOURCE_BASE/$name.png" \
              -o "stake-preview/assets/figuras-3d-aprovadas-20261114/$name.png"
          done
          cd stake-preview/assets/figuras-3d-aprovadas-20261114
          sha256sum -c <<'SUMS'
          2b4ad5075cb18e8bb8f50effc27eb1f9e94c54dca66c14382f4f52e2f5d2340b  bule.png
          bbd3318a0cb049d25ef757f7337141852503c1b208bde3674fe460fa2a2134bd  cogumelo.png
          4e13017587f0e7ba90f2d0d2e27a16c560db044dd2b9394910c386951fd403f8  caracol.png
          2ee7cb9e6328c62011a83fff29b28f2780a2bff30abd873827c3cddb1748d252  pedra.png
          SUMS
          file *.png
          cd ../../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stake-preview/assets/figuras-3d-aprovadas-20261114/*.png
          git commit -m "assets(stake): quatro imagens 3D aprovadas em PNG original"
          git push origin HEAD:refs/heads/stake-4-figuras-3d-aprovadas-20261114
