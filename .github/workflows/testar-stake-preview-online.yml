name: Stake Preview | Confirmar jogo online

on:
  push:
    branches: [main]
    paths:
      - 'stake-preview/**'
      - '.github/workflows/testar-stake-preview-online.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-online:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verificar ficheiros e simulações locais
        run: |
          node stake-preview/tests/hold-probabilities.mjs
          node stake-preview/tests/visual-events.mjs
          node stake-preview/tests/history-replay.mjs
          node stake-preview/tests/audio-assets.mjs
          node stake-preview/tests/intro-bonus.mjs
          node stake-preview/tests/paytable.mjs
          node stake-preview/tests/wild-multipliers.mjs
          node stake-preview/tests/hold-continue.mjs
          node stake-preview/tests/free-continue.mjs
          node stake-preview/tests/cascade-celebrations.mjs
          node stake-preview/tests/auto-control.mjs
          node stake-preview/tests/session-durability.mjs
          node stake-preview/tests/v18-graphics.mjs
      - name: Confirmar GitHub Pages independente das outras publicações
        run: |
          set -euo pipefail
          url="https://hunderburn39-beep.github.io/Jardim-Magico/stake-preview/?v=1.8.1"
          echo "A verificar $url"
          for n in {1..12}; do
            if curl -fLsS --max-time 10 --connect-timeout 5 "$url" -o /tmp/stake-preview.html; then
              if grep -q 'Stake Preview V1.8.1' /tmp/stake-preview.html \
                 && grep -q 'id="skipBtn"' /tmp/stake-preview.html \
                 && grep -q 'id="paylineSvg"' /tmp/stake-preview.html \
                 && grep -q 'id="freePanel"' /tmp/stake-preview.html \
                 && grep -q 'id="historyBtn"' /tmp/stake-preview.html \
                 && grep -q 'id="historyOverlay"' /tmp/stake-preview.html \
                 && grep -q 'id="detailBoard"' /tmp/stake-preview.html \
                 && grep -q 'id="historySearch"' /tmp/stake-preview.html \
                 && grep -q 'id="musicBtn"' /tmp/stake-preview.html \
                 && grep -q 'id="introPlay"' /tmp/stake-preview.html \
                 && grep -q 'id="bonusCurtain"' /tmp/stake-preview.html \
                 && grep -q 'id="paytableBtn"' /tmp/stake-preview.html \
                 && grep -q 'id="paytableOverlay"' /tmp/stake-preview.html \
                 && grep -q 'id="wildTally"' /tmp/stake-preview.html \
                 && grep -q 'id="holdLives"' /tmp/stake-preview.html \
                 && grep -q 'id="holdSummary"' /tmp/stake-preview.html \
                 && grep -q 'id="freeResultOverlay"' /tmp/stake-preview.html \
                 && grep -q 'id="freeRetrigger"' /tmp/stake-preview.html \
                 && grep -q 'id="cascadeMeter"' /tmp/stake-preview.html \
                 && grep -q 'id="winSparks"' /tmp/stake-preview.html \
                 && grep -q 'id="autoHeading"' /tmp/stake-preview.html \
                 && grep -q 'id="sessionStatus"' /tmp/stake-preview.html \
                 && grep -q 'jardim-v181-cenario-limpo.svg' /tmp/stake-preview.html \
                 && grep -q 'jardim-v181-moldura.svg' /tmp/stake-preview.html \
                 && grep -q 'jardim-v181-logo.svg' /tmp/stake-preview.html; then
                curl -fLsS --max-time 10 "https://hunderburn39-beep.github.io/Jardim-Magico/assets/imagens/jm38-caracol.svg" -o /tmp/caracol.svg
                test -s /tmp/caracol.svg
                curl -fLsS --max-time 10 "https://hunderburn39-beep.github.io/Jardim-Magico/stake-preview/assets/jardim-v181-cenario-limpo.svg" -o /tmp/v181-cenario.svg
                curl -fLsS --max-time 10 "https://hunderburn39-beep.github.io/Jardim-Magico/stake-preview/assets/jardim-v181-moldura.svg" -o /tmp/v181-moldura.svg
                test -s /tmp/v181-cenario.svg && test -s /tmp/v181-moldura.svg
                curl -fLsS --max-time 10 "https://hunderburn39-beep.github.io/Jardim-Magico/stake-preview/assets/jardim-v181-logo.svg" -o /tmp/v181-logo.svg
                test -s /tmp/v181-logo.svg
                echo 'CONFIRMADO: Stake Preview V1.8.1 online, PASSAR, linhas e caracol.'
                exit 0
              fi
              echo "Página ainda não atualizada para V1.8.1 ($n/12)."
            else
              echo "Página indisponível ($n/12)."
            fi
            sleep 5
          done
          echo '::error::Não foi possível confirmar a página V1.8.1.'
          exit 1
