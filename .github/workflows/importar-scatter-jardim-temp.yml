name: Importar SCATTER original aprovado (temporario)
on:
  push:
    branches: [stake-scatter-aprovado-122-128-20261114]
permissions:
  contents: write
jobs:
  importar-scatter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guardar PNG original sem redimensionar ou recomprimir
        run: |
          set -euo pipefail
          mkdir -p stake-preview/assets/figuras-3d-aprovadas-20261114
          curl --fail --location --retry 5 --retry-delay 2 --max-time 100 \
            'https://sb-369lmaklgzu6.vercel.run/scatter-3d.png' \
            --output stake-preview/assets/figuras-3d-aprovadas-20261114/scatter-3d.png
          printf '0e1964ceb0a43ff739527842a8b7feded56a04e444c39be6ffdadb5ff46effdc  stake-preview/assets/figuras-3d-aprovadas-20261114/scatter-3d.png\n' | sha256sum --check
          file stake-preview/assets/figuras-3d-aprovadas-20261114/scatter-3d.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stake-preview/assets/figuras-3d-aprovadas-20261114/scatter-3d.png
          git commit -m 'assets(stake): SCATTER 3D original aprovado, PNG intacto'
          git push origin HEAD:refs/heads/stake-scatter-aprovado-122-128-20261114
