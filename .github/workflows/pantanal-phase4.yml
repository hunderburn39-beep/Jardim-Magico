name: Pantanal v2.16 — integrar contador dos bónus
on:
  push:
    paths:
      - '.github/workflows/pantanal-phase4.yml'
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar gerador e regras do APK
        shell: bash
        run: |
          set -euo pipefail
          node --check Pantanal/apk_engine.js
          node --check Pantanal/bonus_ui.js
          node Pantanal/tests/generator_guards.test.cjs
          node Pantanal/tests/apk_engine.test.cjs
          node Pantanal/tests/original_rules.test.cjs
          python3 -m py_compile Pantanal/tools/port_phase4.py
      - name: Integrar e verificar JavaScript dos tambores
        shell: bash
        run: |
          set -euo pipefail
          python3 Pantanal/tools/port_phase4.py
          node - <<'JS'
          const fs=require('fs');
          const page=fs.readFileSync('Pantanal/index.html','utf8');
          const match=[...page.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(x=>x.length>1000);
          if(match.length!==1)throw Error('App script expected once');
          fs.writeFileSync('/tmp/pantanal-main-v216.js',match[0]);
          for(const fragment of ['nextDifficulty(){','state.generatorCalls=difficulty.nextSpins','bonus_ui.js?v=2.16'])
            if(!page.includes(fragment))throw Error('Missing '+fragment);
          JS
          node --check /tmp/pantanal-main-v216.js
          git diff --check
      - name: Gravar Pantanal v2.16 preservando outros jogos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pantanal/index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat(Pantanal): count downDificult checks in spins and bonuses v2.16"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
