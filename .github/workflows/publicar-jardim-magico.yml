name: "Jardim Mágico | Testes independentes"

on:
  push:
    branches: [main, release/jardim-magico-v5]
    paths:
      - 'jardim-phaser/**'
      - 'jardim-3d/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - '.github/workflows/publicar-jardim-magico.yml'
  pull_request:
    branches: [main]
    paths:
      - 'jardim-phaser/**'
      - 'jardim-3d/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - '.github/workflows/publicar-jardim-magico.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jardim-testes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras, queda, recuperacao e versao final
        run: |
          node jardim-phaser/tests/smoke.mjs
          node jardim-phaser/tests/final.mjs
          node jardim-phaser/tests/audio.mjs
          node jardim-3d/tests/smoke-v3.mjs
      - name: Preparar testes em Chromium e WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Servir ficheiros locais
        run: |
          node jardim-phaser/tests/server.mjs > /tmp/jardim-http.log 2>&1 &
      - name: Testar graficos, rolos e cascatas reais
        run: node jardim-phaser/tests/visual.mjs
      - name: Testar interface, administracao, bonus e persistencia
        run: node jardim-phaser/tests/release-browser.mjs
      - name: Guardar provas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jardim-magico-v5-testes
          path: visual-previews/
          if-no-files-found: ignore

