name: Publicar Jardim Magico no navegador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter jogo
        uses: actions/checkout@v4

      - name: Preparar jogo HTML
        run: |
          mkdir -p public
          unzip -oq JardimMagicoAndroid.zip -d android-project
          cp -a android-project/app/src/main/assets/. public/
          test -s public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar ficheiros do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
