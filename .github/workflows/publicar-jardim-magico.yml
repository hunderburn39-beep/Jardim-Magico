name: Testar e publicar Jardim Magico

on:
  push:
    branches: [main, release/jardim-magico-v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jardim-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras, queda, recuperacao e versao final
        run: |
          node jardim-phaser/tests/smoke.mjs
          node jardim-phaser/tests/final.mjs
          node jardim-phaser/tests/audio.mjs
          node jardim-3d/tests/smoke-v3.mjs
      - name: Preparar testes em Chromium e WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Servir ficheiros locais
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/jardim-http.log 2>&1 &
      - name: Testar graficos, rolos e cascatas reais
        run: node jardim-phaser/tests/visual.mjs
      - name: Testar interface, administracao, bonus e persistencia
        run: node jardim-phaser/tests/release-browser.mjs
      - name: Guardar provas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jardim-magico-v5-testes
          path: visual-previews/
          if-no-files-found: ignore

  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Obter jogo verificado
        uses: actions/checkout@v4
      - name: Preparar pagina com fontes editaveis
        shell: bash
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -a css js assets jardim-phaser public/
          for game in jardim-3d templo-do-trovao Farao-Eterno; do
            if test -s "$game/index.html"; then cp -a "$game" public/; fi
          done
          test -s public/jardim-phaser/vendor/phaser-3.90.0.min.js
          test -s public/jardim-phaser/release.json
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar ficheiros do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar versao verificada
        id: deployment
        uses: actions/deploy-pages@v4
