name: Publicar Jardim Magico no navegador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter jogo
        uses: actions/checkout@v4

      - name: Preparar pagina com fontes editaveis
        shell: bash
        run: |
          mkdir -p public
          if test -s index.html; then
            cp index.html public/index.html
            cp -a css js assets public/
            if test -s templo-do-trovao/index.html; then
              cp -a templo-do-trovao public/
            fi
          else
            unzip -oq JardimMagicoAndroid.zip -d android-project
            cp -a android-project/app/src/main/assets/. public/
          fi
          test -s public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar ficheiros do jogo
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: public

      - name: Diagnosticar e cancelar deployment Pages antigo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          old="repos/${{ github.repository }}/pages/deployments/d1601de38adda519c991d5039fff154a67129ea0"
          echo "::group::Estado da publicacao antiga antes de cancelar"
          gh api "$old" || true
          echo "::endgroup::"
          echo "::group::Resposta HTTP do pedido de cancelamento"
          gh api -i -X POST "$old/cancel" || true
          echo "::endgroup::"
          sleep 7
          echo "::group::Estado da publicacao antiga depois de cancelar"
          gh api "$old" || true
          echo "::endgroup::"
          echo "::group::Deployments registados no ambiente github-pages"
          gh api "repos/${{ github.repository }}/deployments" --jq '[.[] | select(.environment=="github-pages") | {id,sha,created_at,ref}] | .[:7]' || true
          echo "::endgroup::"

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
