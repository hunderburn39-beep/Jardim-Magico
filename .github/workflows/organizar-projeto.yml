name: Organizar HTML CSS JavaScript e Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/organizar-projeto.yml

permissions:
  contents: write

jobs:
  organizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Separar o codigo e os recursos do jogo
        run: python3 scripts/organizar_projeto.py

      - name: Validar estrutura
        shell: bash
        run: |
          test -s index.html
          test -d css
          test -d js
          test -d assets
          test -s build.gradle
          test -s app/build.gradle
          if test -f js/jogo.js; then node --check js/jogo.js; fi
          find css js assets -type f | head -50

      - name: Guardar codigo organizado no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js assets app build.gradle settings.gradle gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "Organizar jogo em HTML CSS JS assets e Android"
            git push origin HEAD:main
          fi
