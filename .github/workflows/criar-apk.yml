name: Criar APK Jardim Magico

on:
  # Compilar APK só quando solicitado manualmente no separador Actions.
  # Publicar no navegador continua automático no workflow GitHub Pages.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Preparar projeto Android a partir das fontes editaveis
        shell: bash
        run: |
          if test -s index.html; then
            echo "Usar HTML, CSS, JS e assets organizados"
            test -s app/build.gradle
            mkdir -p app/src/main/assets
            cp index.html app/src/main/assets/index.html
            cp -a css js assets app/src/main/assets/
          else
            echo "Usar ZIP legado como alternativa"
            unzip -oq JardimMagicoAndroid.zip -d .
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar ferramentas
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JardimMagico-APK
          path: app/build/outputs/apk/debug/app-debug.apk
