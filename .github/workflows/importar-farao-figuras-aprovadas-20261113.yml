            '10': 'assets/approved-20261113/10.png?v=approved-20261113-v2',
            'J': 'assets/approved-20261113/J.png?v=approved-20261113-v2',
            'Q': 'assets/approved-20261113/Q.png?v=approved-20261113-v2',
            'K': 'assets/approved-20261113/K.png?v=approved-20261113-v2',
            'A': 'assets/approved-20261113/A.png?v=approved-20261113-v2',
            'HORUS': 'assets/approved-20261113/HORUS.png?v=approved-20261113-v2',
            'MASK': 'assets/approved-20261113/MASK.png?v=approved-20261113-v2',
            'ANUBIS': 'assets/approved-20261113/ANUBIS.png?v=approved-20261113-v2',
