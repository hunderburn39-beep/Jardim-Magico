          test -s "Farao-Eterno/assets/approved-20261113/Q.png"; file "Farao-Eterno/assets/approved-20261113/Q.png" | grep -q 'PNG image'
          test -s "Farao-Eterno/assets/approved-20261113/K.png"; file "Farao-Eterno/assets/approved-20261113/K.png" | grep -q 'PNG image'
