          curl -fL --retry 3 --connect-timeout 10 --max-time 90 "$S_K" -o "Farao-Eterno/assets/approved-20261113/K.png"
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 "$S_A" -o "Farao-Eterno/assets/approved-20261113/A.png"
