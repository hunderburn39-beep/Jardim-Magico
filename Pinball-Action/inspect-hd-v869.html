<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinball Action — Inspeção HD V8.69</title><style>body{background:#10141b;color:#eef3fa;font:15px system-ui;margin:20px}h1{font-size:22px}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{background:#283341;color:white;border:1px solid #64758b;padding:8px;border-radius:5px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:18px}article{background:#1e2631;border:1px solid #364454;border-radius:8px;padding:10px}article>div{display:flex;gap:6px;margin:8px 0}img{width:calc(50% - 3px);aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#333b47 0% 25%,#222a35 0% 50%) 0/12px 12px}.native{image-rendering:pixelated}small{color:#a7b5c8}iframe{position:absolute;width:360px;height:640px;left:-9999px;top:0;pointer-events:none}</style><h1>Inspeção de sprites · V8.69</h1><p>Original à esquerda, 2D-HD à direita. A paleta é a que está carregada no arranque do jogo.</p><header><select id="size"><option value="small">16 × 16</option><option value="big">32 × 32</option></select><select id="pal"></select><label><input id="all" type="checkbox"> Incluir sólidos e transparentes</label><button id="run">Atualizar</button></header><p id="status">A abrir a ROM…</p><main id="grid"></main><iframe id="game" src="./game-v869.html?test=1" title="Motor de inspeção"></iframe><script>const game=document.getElementById('game'),grid=document.getElementById('grid'),status=document.getElementById('status'),pal=document.getElementById('pal');for(let i=0;i<16;i++)pal.add(new Option('Paleta '+i,String(i*8)));let token=0;function render(){const api=game.contentWindow.__pbRom;if(!api){status.textContent='Motor ainda indisponível';return;}const t=++token,big=document.getElementById('size').value==='big',base=Number(pal.value),showAll=document.getElementById('all').checked,count=big?32:256;grid.replaceChildren();let c=0,shown=0;function batch(){if(t!==token)return;try{for(let k=0;k<12&&c<count;k++,c++){const p=api.spritePreview(c,big,base);if(!showAll&&(p.family==='solid'||p.family==='transparent'))continue;const box=document.createElement('article'),title=document.createElement('strong'),row=document.createElement('div'),a=new Image(),b=new Image(),note=document.createElement('small');title.textContent='Sprite '+c;a.src=p.original;a.className='native';a.alt='ROM';b.src=p.hd;b.alt='HD';row.append(a,b);note.textContent=p.family;box.append(title,row,note);grid.append(box);shown++;}status.textContent=shown+' sprites apresentados · '+c+'/'+count+' inspecionados';if(c<count)requestAnimationFrame(batch);}catch(e){status.textContent='Erro: '+e.message;}}batch();}game.addEventListener('load',render);document.getElementById('run').onclick=render;for(const id of ['size','pal','all'])document.getElementById(id).onchange=render;</script></html>
