<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinball Action V8.83 · auditoria privada</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e8edf5;font:15px system-ui,sans-serif;padding:16px}h1{font-size:21px;margin:0 0 8px}p{max-width:800px;color:#b8c7d7}label{display:inline-flex;gap:7px;align-items:center;margin:6px}button,select{font:inherit;background:#243649;color:#e8edf5;border:1px solid #61788b;border-radius:7px;padding:8px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-top:15px}.sprite{border:1px solid #39495b;padding:10px;border-radius:9px}.pair{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}.pair img{width:72px;height:72px;object-fit:contain;background:repeating-conic-gradient(#243040 0% 25%,#1c2634 0% 50%) 0 0/12px 12px}.pair img:first-child{image-rendering:pixelated}small{color:#aebfd0}.review{color:#fecb78}iframe{position:absolute;width:400px;height:680px;left:-9999px;border:0}</style></head><body>
<h1>Pinball Action V8.83 · comparação ROM / HD</h1><p>Auditoria de desenvolvimento. Esquerda: atlas original. Direita: arte HD executada pelo jogo. Os desvios de cobertura indicam peças a rever, não uma falha automática. A bola tem compensação intencional de proporções.</p>
<label>Paleta <select id="bank"></select></label><label>Atlas <select id="scope"><option value="reachable">160 selecionáveis</option><option value="all">288 entradas</option></select></label><button id="run">Comparar sprites</button><p id="status" role="status">A carregar o jogo…</p><div id="grid"></div><iframe id="game" src="game-v883.html?test=1"></iframe>
<script>
const frame=document.getElementById('game'),bank=document.getElementById('bank'),scope=document.getElementById('scope'),grid=document.getElementById('grid'),status=document.getElementById('status'),button=document.getElementById('run');
for(let i=0;i<16;i++){const op=document.createElement('option');op.value=i*8;op.textContent=i;bank.append(op);}
button.disabled=true;let busy=false;
function ready(){if(frame.contentWindow.__pbRom){button.disabled=false;status.textContent='Pronto para comparar.';return true;}return false;}
frame.addEventListener('load',ready);const poll=setInterval(()=>{if(ready())clearInterval(poll)},200);
button.onclick=async()=>{
 if(busy)return;busy=true;button.disabled=true;grid.replaceChildren();let count=0,review=0;const api=frame.contentWindow.__pbRom,base=Number(bank.value);
 try{for(const big of [false,true])for(let code=0;code<(big?32:scope.value==='all'?256:128);code++){
  const a=api.spriteAudit(code,big,base),p=api.spritePreview(code,big,base),item=document.createElement('article');item.className='sprite';const title=document.createElement('b');title.textContent=(big?'32':'16')+' · '+code+' · '+p.family;
  const pair=document.createElement('div');pair.className='pair';for(const [src,alt] of [[p.original,'Original'],[p.hd,'HD']]){const im=new Image();im.src=src;im.alt=alt;pair.append(im);}
  const line=document.createElement('small');const diff=a.missing+a.extra;line.textContent='ROM '+a.nativeCells+' / HD '+a.hdCells+' · desvio '+diff+(a.intentionalAspect?' · bola':'');if(!a.intentionalAspect&&diff>Math.max(4,a.nativeCells*.10)){line.className='review';review++;}item.append(title,pair,line);grid.append(item);count++;
  if(count%16===0){status.textContent=count+' sprites comparados';await new Promise(requestAnimationFrame);}
 }status.textContent=count+' sprites comparados · '+review+' para revisão visual';
 }catch(e){status.textContent='Erro: '+e.message;}finally{busy=false;button.disabled=false;}
};
</script></body></html>
