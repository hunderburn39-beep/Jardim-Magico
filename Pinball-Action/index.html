<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#040409"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pinball Action V8.18 — 3 AY originais em tempo real</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#040409;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

window.addEventListener('keydown',e=>{let k=keyboard[e.code];if(!k)return;e.preventDefault();if(!e.repeat)press(k,true)});
window.addEventListener('keyup',e=>{let k=keyboard[e.code];if(!k)return;e.preventDefault();press(k,false)});
window.addEventListener('blur',()=>{active.clear();for(const k in pending)pending[k]=0;endStartRequest();refreshKeys()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)arcadeAudio.restore();if(document.hidden){active.clear();for(const k in pending)pending[k]=0;endStartRequest();refreshKeys()}});
let last=performance.now(),acc=0,frames=0;
function frame(now){
 let delta=Math.min(70,now-last);last=now;
 if(!document.hidden){
  acc+=delta*60/1000;
  let count=0;
  while(acc>=1&&count<2){
   // Our initial state was captured at the end of a real 60 Hz arcade frame.
   for(let i=0;i<6500;i++){if(cpu.halt)break;cpu.step();}
   cpu.nmi();finishInputFrame();acc-=1;count++;frames++;
  }
  if(cpu.videoChanged||frames===0){render();cpu.videoChanged=false;}
 }
 requestAnimationFrame(frame);
}
render();requestAnimationFrame(frame);
// Debug/test API (not visible in production).
if(window.PB_TEST||new URLSearchParams(location.search).has('test')) window.__pbRom={
 state:()=>({pc:cpu.pc,sp:cpu.sp,credits:memory[0xc013],queuedStart:queuedStart?.key||null,score:memory.slice(0xc000,0xc010).join(','),steps:cpu.steps,scroll:cpu.scroll,frames,nmi:cpu.nmiEnable,flipped:cpu.flipped,memChecksum:memory.slice(0xd000,0xe600).reduce((a,b)=>a+b,0)}),
 input:(k,on)=>press(k,!!on),pending:()=>({...pending}),frame:()=>{for(let i=0;i<16667;i++)cpu.step();cpu.nmi();finishInputFrame();render()},
 image:()=>canvas.toDataURL(),audio:()=>arcadeAudio.state(),sound:(cmd)=>arcadeAudio.fromRom(cmd),audioDebug:()=>arcadeAudio.debug(),cpu};
})();
</script></body></html>
