<!DOCTYPE html>
<html lang="pt-PT"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#080613">
<title>Pinball Action 1985 — Original Tables V3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#050408;font-family:system-ui,-apple-system,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:540px;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#050408;gap:5px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#screen{height:min(calc(100dvh - 102px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(100vw * 1.34));width:min(calc((100dvh - 102px) * .75),100vw);max-width:100%;max-height:100%;position:relative;overflow:hidden;background:#060506;flex-shrink:1}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#controlPanel{width:min(100%,480px);height:85px;flex:0 0 85px;display:flex;align-items:center;padding:5px 9px;background:transparent}
#actionRow{display:grid;grid-template-columns:.75fr 1.15fr 1.15fr .85fr;gap:7px;width:100%;height:69px}
.key{appearance:none;border:2px solid #a5a6ac;border-radius:8px;background:linear-gradient(#292a31,#101117);color:#f7f5ed;font-weight:900;font-size:clamp(12px,3.4vw,16px);touch-action:none;box-shadow:0 3px 0 #111, inset 0 1px 3px #eee2;cursor:pointer;white-space:normal}
.key.flipper{border-color:#e4d8ae;background:linear-gradient(#514637,#252223);font-size:clamp(14px,4vw,19px)}
.key.shoot{border-color:#dfa353;background:linear-gradient(#5d421c,#2b261d)}
.key:active,.key.down{transform:translateY(2px);background:linear-gradient(#664634,#302520);box-shadow:inset 0 2px 8px #000}
#scorebar,#mission,#utilityRow,header{display:none!important}
#overlay{position:absolute;z-index:6;top:49%;left:50%;transform:translate(-50%,-50%);text-align:center;width:88%;text-shadow:2px 3px 0 #08050c,0 2px 10px #000;background:transparent;pointer-events:none}
#overlay h1{font:bold italic clamp(22px,6vw,34px)/1 system-ui;color:#fae44e;margin:0 0 9px}
#overlay p{font:bold 12px/1.3 ui-monospace,monospace;color:#fff7ba;margin:6px auto}
#start{margin:10px auto 0;pointer-events:auto;min-height:42px;padding:9px 26px;color:#fff7c7;background:#791c37;border:2px solid #ffe06e;border-radius:3px;font-weight:900;font-size:14px}
#note{font-size:10px;opacity:.88;margin-top:6px}
.hidden{display:none!important}
@media(orientation:landscape){#app{max-width:100vw;flex-direction:row;gap:8px}#screen{width:min(calc((100dvh - 12px) * .75),calc(100vw - 190px));height:min(calc(100dvh - 12px),calc((100vw - 190px) * 1.34))}#controlPanel{max-width:178px;width:178px;height:100%;flex:0 0 178px;padding:8px}#actionRow{grid-template-columns:1fr 1fr;height:160px;gap:8px;align-self:center}.key{font-size:12px}}
</style></head>
<body><div id="app">
<!-- O original coloca a pontuação dentro da parte inferior da própria mesa. -->
<div id="screen"><canvas id="game" width="224" height="256" aria-label="Pinball Action: mesa arcade original"></canvas>
<div id="overlay"><h1>PINBALL ACTION</h1><p>4 MESAS · ARCADE 1985</p><button id="start">JOGAR</button></div></div>
<div id="controlPanel"><div id="actionRow"><button class="key" id="shake" aria-label="Abanar a mesa">SHAKE</button><button class="key flipper" id="left" aria-label="Flipper esquerdo">◀ ESQ.</button><button class="key flipper" id="right" aria-label="Flipper direito">DIR. ▶</button><button class="key shoot" id="shoot" aria-label="Lançar bola">LANÇAR</button></div></div>
<!-- Os nós seguintes só existem para compatibilidade com o motor: não ocupam ecrã. -->
<div id="scorebar"><span id="score"></span><span id="balls"></span><span id="bonus"></span><span id="high"></span></div>
<div id="mission"><span id="missionText"></span><span id="missionProgress"></span></div>
<div id="utilityRow"><button id="reset"></button><span id="message"></span><button id="sound"></button><button id="fs"></button></div>
</div>

// Table art: unmodified real screenshots of the Tehkan game, hosted by Arcade Archives.
// Draw just the playfield crop; the arcade's printed SCORE/BALL/BONUS area is part of each picture.
// If a network image is unavailable, fall back to the locally constructed ROM-tile approximation.
const officialSources={
 purple:'https://www.arcadearchives.com/wp/wp-content/uploads/2025/04/aca-b5mq3vk8-ss01.png',
 red:'https://www.arcadearchives.com/wp/wp-content/uploads/2025/04/aca-b5mq3vk8-ss03.png',
 green:'https://www.arcadearchives.com/wp/wp-content/uploads/2025/04/aca-b5mq3vk8-ss05.png',
 blue:'https://www.arcadearchives.com/wp/wp-content/uploads/2025/04/aca-b5mq3vk8-ss06.png'
};
const officialImages={};
for(const [table,src] of Object.entries(officialSources)){
 const img=new Image();img.referrerPolicy='no-referrer';img.src=src;
 img.onload=()=>{officialImages[table]=img};img.onerror=()=>{officialImages[table]=null};
}
function drawOriginalTable(){
 const img=officialImages[g.table];
 if(img&&img.complete&&img.naturalWidth){
  // 1000 × 563 promotional shot; original 420 × 563 cabinet image centered within the matte.
  c.drawImage(img,img.naturalWidth*.289,0,img.naturalWidth*.422,img.naturalHeight,0,0,W,H);
  return true;
 }
 drawWall();if(g.table==='green')drawMain();else if(g.table==='red')drawFire();else if(g.table==='blue')drawBlue();else drawPurple();
 return false;
}

function launch(){ac();if(g.mode==='attract'||g.mode==='over'){startGame();return}if(g.mode==='drain')return;if(g.mode==='ready'&&g.ball){g.ball.x=206;g.ball.y=210;g.ball.vx=-.14-Math.random()*.12;g.ball.vy=-10.3;g.ball.shot=true;g.mode='play';g.firstLaunch=false;putMsg('GOOD LUCK',47);sound('launch')}}
function flip(side,on){if(g.fl[side]===on)return;g.fl[side]=on;if(on&&g.mode!=='attract')sound('flipper')}
function nudge(){ac();if(g.mode!=='play'||!g.ball)return;g.tilts++;g.ball.vx+=g.ball.x<112?-1.5:1.5;g.ball.vy-=1.35;g.shake=14;sound('shake');if(g.tilts>=5){g.lock=true;putMsg('TILT! FLIPPERS OFF',110)}}
function award(p,x,y,fx='target'){g.score+=p;g.bonus=Math.min(99,g.bonus+1);g.stageScore+=p;if(g.score>g.high){g.high=g.score;try{localStorage.setItem('pbaction_arcade_high',g.high)}catch(e){}}for(const threshold of [70000,200000]){if(g.score>=threshold&&!g.scoreAwards.includes(threshold)){g.scoreAwards.push(threshold);g.balls++;putMsg('EXTRA BALL '+threshold+' PONTOS!',100);sound('extra')}}if(x!==undefined)spawn(x,y,7,fx==='bumper'?'#f2fc63':'#fbc8ff');sound(fx==='bumper'?'bumper':'target');updateHud()}
function segmentHit(b,x1,y1,x2,y2,boost=0,rest=.79){const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy,tt=Math.min(1,Math.max(0,((b.x-x1)*dx+(b.y-y1)*dy)/(len2||1))),nx=x1+tt*dx,ny=y1+tt*dy,rx=b.x-nx,ry=b.y-ny,dist=Math.hypot(rx,ry);if(dist>=b.r+2.0||!dist)return false;const ux=rx/dist,uy=ry/dist;const approach=b.vx*ux+b.vy*uy;if(approach>=.5)return false;b.x=nx+ux*(b.r+2.1);b.y=ny+uy*(b.r+2.1);b.vx-=(1+rest)*approach*ux;b.vy-=(1+rest)*approach*uy;if(boost){b.vx+=ux*boost;b.vy+=uy*boost}return true}
function circleHit(b,x,y,r,boost=1.6,rest=.9){const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy),rr=b.r+r;if(d>rr||d<.001)return false;const nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;if(dot>=0)return false;b.x=x+nx*(rr+.5);b.y=y+ny*(rr+.5);b.vx-=(1+rest)*dot*nx;b.vy-=(1+rest)*dot*ny;b.vx+=nx*boost;b.vy+=ny*boost;return true}
let lastGate=0;
function warp(to){if(g.warpTimer>0||g.mode!=='play'||!colors[to]||g.table===to)return;g.table=to;g.warpTimer=42;g.bonus=Math.min(99,g.bonus+2);g.redSpinTimer=0;putMsg('WARP • '+colors[to].name,95);g.ball.x=to==='purple'?183:110;g.ball.y=to==='purple'?55:57;g.ball.vx=to==='purple'?-1.9:(Math.random()-.5)*3;g.ball.vy=-.5;g.returnPending=0;sound('warp');updateHud()}
function tryColorGate(b){if(g.table!=='purple')return;const positions=[[171,220],[187,212],[203,204]];for(let i=0;i<3;i++){const [x,y]=positions[i];if(circleHit(b,x,y,7,.5)&&hitOnce('gate'+i,35)){hitMainColor(i);break}}}
function physics(dt){const b=g.ball;if(!b)return;if(g.mode==='ready'||g.mode==='drain')return;
 if(g.warpTimer>0){g.warpTimer--;return}if(g.messageTimer>0)g.messageTimer--;
 if(g.redSpinTimer>0){g.redSpinTimer--;if(g.redSpinTimer===0)finishRedSpin();}
 if(g.returnPending>0){g.returnPending--;if(g.returnPending===0){returnToMain();return;}}
 for(let q=0;q<2;q++){
 b.vy+=.060*dt;b.vx*=Math.pow(.9995,dt);b.vy*=.9995;b.vx=Math.max(-7.7,Math.min(7.7,b.vx));b.vy=Math.max(-11.2,Math.min(6.8,b.vy));b.x+=b.vx*dt*.5;b.y+=b.vy*dt*.5;
 if(b.shot&&b.x>=199&&b.y<35){b.shot=false;b.x=188;b.y=35;b.vx=-4.0;b.vy=1.1;spawn(194,29,7,'#ffeaaa')}
 if(b.shot)continue;
 if(b.x<15){b.x=15;b.vx=Math.abs(b.vx)*.84;soundThrottled('wall',6)}if(b.x>209){b.x=209;b.vx=-Math.abs(b.vx)*.86;soundThrottled('wall',6)}
 if(b.y<15){b.y=15;b.vy=Math.abs(b.vy)*.77;soundThrottled('wall',6)}
 if(b.y>235){drainBall();return}
 for(const s of [[19,14,30,34],[205,14,194,34],[20,73,40,105],[204,73,184,105],[32,166,66,206],[192,166,158,206],[14,189,45,216],[210,189,179,216]]){if(segmentHit(b,...s,1.0,.85))soundThrottled('wall',5)}
 if(b.y>188){if(!g.lock){const li=[70,214,100,g.fl.l?204:232],ri=[154,214,124,g.fl.r?204:232];for(const [side,seg] of [['l',li],['r',ri]]){if(segmentHit(b,...seg,g.fl[side]?3.8:.35,.62)){if(g.fl[side]){b.vy=Math.min(b.vy,-6.5-Math.random()*.8);b.vx+=(side==='l'?1:-1)*(.65+Math.random()*.5)}else b.vy=Math.min(b.vy,-1.0);soundThrottled('flipper',6)}}}
 if(circleHit(b,55,189,6,2.1)||circleHit(b,169,189,6,2.1)){soundThrottled('bumper',11);g.flash=9}}
 let bs=g.table==='green'?[[160,38,13],[140,76,12]]:g.table==='red'?[[65,37,12],[115,84,11],[154,84,11]]:g.table==='blue'?[[172,38,12]]:[[176,33,12]];
 for(const [x,y,r] of bs){if(circleHit(b,x,y,r,3.2,.98)&&hitOnce('b'+x+''+y,8)){g.flash=9;award(100,x,y,'bumper')}}
 if(g.table==='purple'){
  for(let i=0;i<3;i++){const x=173+i*17;if(b.x>x-9&&b.x<x+9&&b.y>54&&b.y<81&&hitOnce('abc'+i,55))hitMainABC(i)}
  tryColorGate(b);
  if(g.lit.every(Boolean)&&!g.specialClaimed&&testCollisionRollover(b,188,124,10)&&hitOnce('special',60))hitMainSpecial();
 }else{
  if(g.table==='green'){for(let i=0;i<BOWLING_PINS.length;i++){const [x,y]=BOWLING_PINS[i];if(testCollisionRollover(b,x,y,6)&&hitOnce('pinroll'+i,22))handleBowlingPin(i);}}
  if(g.table==='blue'){for(let i=0;i<BLUE_CARDS.length;i++){const o=BLUE_CARDS[i];if(testCollisionRollover(b,o.x,o.y,8)&&hitOnce('card'+i,34)){handleBlueCard(i);b.vy=-Math.abs(b.vy)*.65-.6;}}}
  if(g.table==='red'){for(const [i,x,y] of [[0,47,108],[1,179,108]]){if(testCollisionRollover(b,x,y,9)&&hitOnce('spinner'+i,55)){handleRedSpinner();b.vy=-Math.abs(b.vy)*.7-.9;}}}
  if(g.missions[g.table].lit&&!g.missions[g.table].completed&&testCollisionRollover(b,190,116,11)&&hitOnce('E'+g.table,45)){claimE()}
  if(testCollisionRollover(b,199,56,10)&&hitOnce('return'+g.table,50)){returnToMain();return}
 }
 if(b.y>235){drainBall();return}
 }
}
function hitOnce(key,limit){if(g.frame-(hitCooldown[key]||-200)<limit)return false;hitCooldown[key]=g.frame;return true}
function soundThrottled(type,frames){if(hitOnce('s'+type,frames))sound(type)}
function drainBall(){if(g.mode==='drain'||g.mode==='over')return;g.mode='drain';g.ball=null;g.balls=Math.max(0,g.balls-1);g.score+=g.bonus*100;g.bonus=0;g.wait=95;g.tilts=0;g.lock=false;g.redSpinTimer=0;g.returnPending=0;g.table='purple';g.gates=[false,false,false];g.targets=[false,false,false];putMsg(g.balls>0?'BOLA PERDIDA':'GAME OVER',95);sound('drain');updateHud()}
function tick(t){g.frame++;if(g.mode==='play'){physics(1);noteMelody(t)}if(g.mode==='drain'){if(--g.wait<=0){if(g.balls>0){g.ball={x:206,y:208,vx:0,vy:0,r:3.8,shot:false};g.mode='ready';putMsg('LANÇA A PRÓXIMA BOLA',65)}else{g.mode='over';$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').textContent='GAME OVER';$('overlay').querySelector('p').textContent='PONTOS '+g.score+' · RECORDE '+g.high;$('start').textContent='JOGAR NOVAMENTE'}}}
 if(g.ball&&!g.ball.r)g.ball.r=3.8;if(g.messageTimer>0&&g.mode!=='play')g.messageTimer--;if(g.shake>0)g.shake--;if(g.flash>0)g.flash--;
 for(const p of g.particle){p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.life--}g.particle=g.particle.filter(x=>x.life>0).slice(-100);
 display();requestAnimationFrame(tick)}
$('start').addEventListener('click',startGame);document.getElementById('game').addEventListener('pointerdown',()=>{if(g.mode==='attract'||g.mode==='over')startGame()});$('reset').addEventListener('click',startGame);$('shoot').addEventListener('pointerdown',e=>{e.preventDefault();launch()});$('shake').addEventListener('pointerdown',e=>{e.preventDefault();nudge()});$('sound').addEventListener('click',()=>{soundEnabled=!soundEnabled;$('sound').textContent=soundEnabled?'♫ SOM ON':'♫ SOM OFF';if(soundEnabled){ac();sound('coin')}});
$('fs').addEventListener('click',()=>{const a=$('app');if(document.fullscreenElement){document.exitFullscreen?.()}else if(a.requestFullscreen){a.requestFullscreen().catch(()=>{})}else{try{window.scrollTo(0,1)}catch(e){}}});
for(const [id,s] of [['left','l'],['right','r']]){const btn=$(id);const active=e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);btn.classList.add('down');flip(s,true)};const clear=e=>{e.preventDefault();btn.classList.remove('down');flip(s,false)};btn.addEventListener('pointerdown',active);for(const ev of ['pointerup','pointercancel','lostpointercapture','pointerleave'])btn.addEventListener(ev,clear)}
// Taps on the lower half of the table also control flippers. The whole app prevents Safari swipe-to-refresh / scroll interruptions.
can.addEventListener('pointerdown',e=>{e.preventDefault();const r=can.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*224,y=(e.clientY-r.top)/r.height*256;if(g.mode==='attract'||g.mode==='over'){startGame();return}if(g.mode==='ready'){launch();return}if(y>175){const side=x<112?'l':'r';flip(side,true);can._touchSide=side;can.setPointerCapture?.(e.pointerId)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])can.addEventListener(ev,()=>{if(can._touchSide){flip(can._touchSide,false);can._touchSide=null}});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space','KeyA','KeyD','KeyZ','KeyM'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='KeyZ')flip('l',true);if(e.code==='ArrowRight'||e.code==='KeyD'||e.code==='KeyM')flip('r',true);if(e.code==='Space'||e.code==='ArrowDown'||e.code==='Enter')launch();if(e.code==='ArrowUp'||e.code==='KeyS')nudge()});
window.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA','KeyZ'].includes(e.code))flip('l',false);if(['ArrowRight','KeyD','KeyM'].includes(e.code))flip('r',false)});document.addEventListener('visibilitychange',()=>{if(document.hidden){flip('l',false);flip('r',false)}});
if(new URLSearchParams(location.search).has('test'))window.__pbTest={state:()=>JSON.parse(JSON.stringify({table:g.table,mode:g.mode,score:g.score,balls:g.balls,credits:g.credits,gates:g.gates,lit:g.lit,missions:g.missions,specialClaimed:g.specialClaimed,redSpinTimer:g.redSpinTimer})),start:startGame,play:()=>{if(g.mode==='ready')launch()},gate:hitMainABC,color:hitMainColor,pin:handleBowlingPin,card:handleBlueCard,spinner:handleRedSpinner,setReels:a=>{g.missions.red.reels=a;g.redSpinTimer=1;finishRedSpin()},e:claimE,special:hitMainSpecial,warp:to=>{g.warpTimer=0;if(g.mode==='ready')g.mode='play';warp(to);g.warpTimer=0},main:returnToMain,drain:drainBall};
// Attract mode draws a running original-style table, not a placeholder.
g.missions=makeMissions();g.ball={x:206,y:208,r:3.8,vx:0,vy:0};updateHud();requestAnimationFrame(tick);
</script></body></html>
