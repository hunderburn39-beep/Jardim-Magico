<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090f29">
<title>Raspadinha 100X — Edição Premium</title>
<style>
:root{color-scheme:dark;--gold:#ffd34a;--blue:#0b3268;--light:#fff2b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:radial-gradient(ellipse at 50% 18%,#1767a6 0,#0a2a62 45%,#05132e 100%);color:#fff;font:600 15px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{appearance:none;border:0;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
header{height:65px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px;background:linear-gradient(160deg,#d57a0d 0%,#ffcc3c 35%,#fff19b 50%,#d9840a 90%);box-shadow:0 4px 12px #0005;color:#092754}
.logo{font-size:clamp(30px,8vw,42px);font-weight:1000;line-height:1;text-shadow:1px 2px #fff6}
.brand{font-weight:950;font-size:clamp(18px,5vw,26px);line-height:.97;letter-spacing:.7px}
.brand small{display:block;font-size:11px;letter-spacing:1.8px;margin-top:3px}
main{width:min(100%,460px);height:calc(100dvh - 65px);margin:0 auto;padding:9px 12px max(9px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.summary{display:flex;align-items:center;justify-content:space-between;background:#05182ac9;border:1px solid #7ab3f45e;padding:8px 12px;border-radius:12px;flex:none}
.summary strong{color:#ffe77e;font-size:19px;font-variant-numeric:tabular-nums}
.summary button{background:#183e65;color:#fff;border:1px solid #7eafca70;border-radius:8px;padding:6px 9px;font-size:12px}
.ticket{background:linear-gradient(130deg,#ffa515,#ffdd4b 37%,#e89716 100%);border:4px solid #fff0a4;border-radius:18px;color:#0a315c;display:flex;flex:1;min-height:0;flex-direction:column;padding:8px;box-shadow:0 5px 16px #0007,inset 0 0 15px #fff6}
.tickettop{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900;padding:0 2px 3px}
.tickettop span:last-child{background:#103a6a;color:#fff7bf;padding:4px 8px;border-radius:14px}
h2{font-size:clamp(11px,3.3vw,15px);margin:5px 0 6px;text-align:center;letter-spacing:.6px;font-weight:1000}
.numgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;touch-action:none;min-width:0}
.lucky{height:clamp(43px,9vh,72px);flex:none}
.play{grid-template-rows:repeat(4,minmax(0,1fr));flex:1;min-height:0}
.cell{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;border:2px solid #c7861b;background:linear-gradient(160deg,#fff6cd,#fff3a2);color:#0b3563;box-shadow:inset 0 1px 4px #fff,0 1px 3px #7d480a70}
.cell b{font-size:clamp(18px,5vw,26px);line-height:1.05}
.cell small{font-weight:900;font-size:clamp(9px,2.4vw,12px);margin-top:3px;white-space:nowrap}
.cell.winning{background:linear-gradient(140deg,#ff8888 0%,#f12125 45%,#a7000b 100%);border:2px solid #ffcb43;color:#fff8dc;box-shadow:inset 0 0 8px #ffdb8380,0 0 10px #ffdb6990;isolation:isolate}
.cell.winning b,.cell.winning small{color:#fff8d9;text-shadow:0 1px 2px #520000,0 0 5px #ffe67c}
.cell.winning.revealed{box-shadow:inset 0 0 12px #ffeb90,0 0 14px #ffd13d,0 0 22px #ffa614}
.cell.winning.flash-win{animation:prizeFlash .75s ease-in-out 6 alternate}
@keyframes prizeFlash{
  from{filter:brightness(1);box-shadow:inset 0 0 7px #ffc44c,0 0 7px #ffb829}
  to{filter:brightness(1.5);box-shadow:inset 0 0 18px #fff09d,0 0 18px #ffdc37,0 0 28px #ffd13d}
}
@media(prefers-reduced-motion:reduce){.cell.winning.flash-win{animation:none}}
.cell canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.actions{display:flex;gap:8px;flex:none}
.actions button{border-radius:10px;padding:12px 8px;min-height:46px;font-size:clamp(11px,3.1vw,14px);font-weight:950}
#new{background:linear-gradient(#ffe46c,#ffb718);color:#17395f;flex:1.45;box-shadow:0 3px #b47800}
#reveal{background:#e2edff;color:#123967;flex:.8;box-shadow:0 3px #8695ad}
#status{margin:0;min-height:35px;text-align:center;display:grid;place-items:center;border-radius:9px;background:#03162ea8;color:#fff8c6;font-size:13px;padding:5px;flex:none}
footer{text-align:center;color:#b5c9e1;font-size:10px;line-height:1.2;flex:none}
@media(max-height:700px){header{height:53px}.logo{font-size:29px}.brand{font-size:18px}main{height:calc(100dvh - 53px);padding-top:5px;gap:5px}.lucky{height:43px}h2{margin:2px 0 4px}.actions button{min-height:40px;padding:7px}.ticket{padding:5px}.summary{padding:5px 9px}#status{min-height:27px}footer{font-size:9px}}

/* Celebração: quatro lançamentos de fogos, com prémio sempre ao centro. */
.celebration-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;isolation:isolate}
.celebration-overlay[hidden]{display:none!important}
.celebration-overlay::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,#240d0180 0%,#0106169c 78%);animation:celebrationFade .22s ease-out}
.celebration-stage{position:relative;width:min(100%,500px);height:270px;display:flex;align-items:center;justify-content:center}
.celebration-center{position:relative;z-index:4;text-align:center;padding:12px 4px;filter:drop-shadow(0 4px 8px #180000)}
.celebration-title{font-weight:1000;letter-spacing:1.6px;color:#fff1b1;font-size:clamp(21px,6vw,31px);text-shadow:0 2px 2px #780000,0 0 14px #ffb92e}
.celebration-amount{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(42px,11vw,64px);font-weight:1000;color:#ffe881;-webkit-text-stroke:1px #e77c0c;text-shadow:0 2px #8d1200,0 0 9px #f44322,0 0 25px #ffcf45;animation:prizeBounce .55s ease-out both}
.celebration-fireworks{position:absolute;top:50%;width:1px;height:1px;z-index:2}
.celebration-fireworks.left{left:14%}
.celebration-fireworks.right{right:14%}
.firework-spark{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:#ffe36a;box-shadow:0 0 9px 3px #ffc12e;opacity:0;animation:fireworkBurst 1.06s cubic-bezier(.15,.4,.42,1) forwards;will-change:transform,opacity}
.firework-spark.red{background:#ff4545;box-shadow:0 0 10px 3px #ff1818}
.firework-core{position:absolute;width:26px;height:26px;border-radius:50%;left:-13px;top:-13px;background:#fff6c5;box-shadow:0 0 20px 10px #ffa824;animation:fireworkCore .75s ease-out forwards;pointer-events:none}
@keyframes fireworkBurst{0%{transform:translate(0,0) scale(.2);opacity:1}35%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.08);opacity:0}}
@keyframes fireworkCore{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(3)}}
@keyframes prizeBounce{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.13);opacity:1}100%{transform:scale(1)}}
@keyframes celebrationFade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.celebration-amount{animation:none}.firework-spark,.firework-core{animation-duration:.15s}}


.celebration-overlay{pointer-events:auto;background:radial-gradient(ellipse at center,#1a235d99,#030817e8 75%);backdrop-filter:blur(5px)}
.celebration-stage{width:min(95vw,500px);height:min(75dvh,560px);border:3px solid #ffc64b;border-radius:24px;background:radial-gradient(ellipse at 50% 40%,#1a376d 0%,#070e29 72%);box-shadow:0 0 40px #ffb31c88,inset 0 0 50px #244fb7a0;flex-direction:column;overflow:hidden}
.celebration-stage:before{content:"";position:absolute;inset:6px;border:2px solid #d92b60;border-radius:18px;box-shadow:0 0 18px #ff276d,0 0 35px #195bff inset;pointer-events:none}
.celebration-stage:after{content:"";position:absolute;bottom:60px;width:85%;height:25px;border-radius:50%;background:#ffbb22;filter:blur(20px);opacity:.65}
.celebration-center{width:100%;padding:12px;z-index:5}
.celebration-brand{font-weight:1000;font-size:clamp(20px,6vw,30px);color:#eaf5ff;text-shadow:0 0 12px #55aaff;letter-spacing:1px;margin-bottom:26px}
.celebration-brand strong{display:block;font-size:clamp(50px,17vw,90px);line-height:.9;color:#ffd34d;text-shadow:0 3px #a32500,0 0 18px #ff4a19}
.celebration-title{font-size:clamp(27px,8vw,44px);color:#ffd652;text-shadow:0 3px #a62600,0 0 20px #fa5525}
.celebration-subtitle{font-size:clamp(18px,5vw,28px);font-weight:1000;color:#f3f8ff;margin:12px 0}
.celebration-amount{font-size:clamp(38px,10vw,61px);white-space:nowrap}
.celebration-fireworks.left{left:20%;top:34%}.celebration-fireworks.right{right:20%;top:34%}
#celebration-close{position:absolute;z-index:8;bottom:24px;left:50%;transform:translateX(-50%);border:2px solid #ffe27e;border-radius:28px;background:linear-gradient(#e72c40,#8c061d);box-shadow:0 5px 0 #5e0715,0 0 18px #ff8d34;color:white;padding:12px 32px;font-weight:1000;font-size:17px;white-space:nowrap}

/* V3.1 | Edição Premium — cenário fixo e interface 9:16 */
:root{--gold:#f9c755;--gold2:#fff2ae;--ruby:#d31d4b;--night:#060b1e}

.ticket>*{position:relative;z-index:1}

}

<body>
<header><div class="logo">100X</div><div class="brand">O DINHEIRO<small>RASPADINHA</small></div></header>
<main>
  <div class="summary"><div>SALDO <strong id="balance">100,00 €</strong></div><button id="sound" type="button" aria-label="Desligar som">🔊 Som ligado</button></div>
  <section class="ticket" aria-label="Bilhete de raspadinha">
    <div class="tickettop"><span id="ticketid">BILHETE Nº 1</span><span>10 € → ATÉ 1.000 €</span></div>
    <h2>NÚMEROS DA SORTE</h2>
    <div class="numgrid lucky" id="lucky"></div>
    <h2>OS TEUS NÚMEROS</h2>
    <div class="numgrid play" id="play"></div>
  </section>
  <div class="actions"><button id="new" type="button">NOVA RASPADINHA · 10 €</button><button id="reveal" type="button">RASPAR TUDO</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <footer>Protótipo de teste local. Sem depósitos ou pagamentos reais.</footer>
</main>

<div id="celebration" class="celebration-overlay" aria-hidden="true" hidden>
  <div class="celebration-stage">
    <div class="celebration-fireworks left" id="fireworks-left"></div>
    <div class="celebration-center">
      <div class="celebration-brand">RASPADINHA <strong>100X</strong></div><div class="celebration-title">PARABÉNS!</div><div class="celebration-subtitle">GANHASTE</div>
      <div class="celebration-amount" id="celebration-amount">0 €</div>
    </div>
    <div class="celebration-fireworks right" id="fireworks-right"></div><button id="celebration-close" type="button">CONTINUAR ▶</button>
  </div>
</div>
<audio id="fireworks-audio" preload="auto" src="./Fireworks.mp3"></audio>
<script>
"use strict";
// Valores em cêntimos: 1 € por bilhete; prémio mínimo vencedor 1 € e máximo 100 €.
// Divisão de cada bilhete: técnico 10%, comerciante 20%, fundo 10%, cofre de prémios 60%.
// O jogo nunca compromete prémios superiores ao montante disponível no cofre.
const KEY="raspadinha100x_v3_10eur";
const PRICE=1000;
const PRIZES=[
  {value:1000, weight:700},{value:2000, weight:250},{value:5000, weight:30},
  {value:10000, weight:10},{value:20000, weight:6},{value:50000, weight:3},
  {value:100000, weight:1}
];
const el=id=>document.getElementById(id);
const eur=c=>(c/100).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const money=c=>(c/100).toLocaleString("pt-PT",{maximumFractionDigits:0})+" €";
const randomInt=max=>Math.floor(Math.random()*max);
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=randomInt(i+1);[items[i],items[j]]=[items[j],items[i]]}return items}
function fresh(){return{balance:100000,prizeBank:0,reserve:0,technician:0,merchant:0,cards:0,ticket:null,sound:true}}
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(saved && ["balance","prizeBank","reserve","technician","merchant","cards"].every(k=>Number.isSafeInteger(saved[k]) && saved[k]>=0))return saved;
  }catch(_){}
  return fresh();
}
let state=load(),scratchAudio=null,audioContext=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}}
function status(msg){el("status").textContent=msg}
function paintBalance(){el("balance").textContent=eur(state.balance);el("sound").textContent=state.sound?"🔊 Som ligado":"🔇 Som desligado";el("sound").setAttribute("aria-label",state.sound?"Desligar som":"Ligar som")}
function selectPrize(bank){
  if(bank<PRICE || Math.random()>=0.30)return 0;
  const eligible=PRIZES.filter(p=>p.value<=bank);
  if(!eligible.length)return 0;
  const total=eligible.reduce((s,p)=>s+p.weight,0);
  let draw=Math.random()*total;
  for(const p of eligible){draw-=p.weight;if(draw<0)return p.value}
  return eligible[eligible.length-1].value;
}
function buy(){
  if(state.ticket && !state.ticket.completed){status("Raspa ou revela primeiro o bilhete atual.");return}
  if(state.balance<PRICE){status("Saldo insuficiente para comprar outro bilhete.");return}
  stopScratchSound();
  clearCelebration();
  state.balance-=PRICE;
  state.technician+=100;
  state.merchant+=200;
  state.reserve+=100;
  state.prizeBank+=600;
  const prize=selectPrize(state.prizeBank);
  state.prizeBank-=prize; // reserva contabilística antes de revelar, evitando ultrapassar o cofre
  const nums=shuffle(Array.from({length:70},(_,i)=>i+1));
  const lucky=nums.slice(0,5),play=nums.slice(5,25);
  const winAt=prize>0?randomInt(20):-1;
  if(winAt>=0)play[winAt]=lucky[randomInt(5)];
  state.cards++;
  state.ticket={id:state.cards,lucky,play,prize,winAt,revealed:[],completed:false};
  save();render();
  status("Raspa com o dedo. Cada bilhete custa 10 €.");
}
function makeCell(parent,num,label,id,isWinner,alreadyRevealed){
  const cell=document.createElement("div");
  cell.className="cell"+(isWinner?" winning":"")+(isWinner&&alreadyRevealed?" revealed":"");
  const number=document.createElement("b");number.textContent=String(num).padStart(2,"0");cell.append(number);
  if(label){const amount=document.createElement("small");amount.textContent=label;cell.append(amount)}
  el(parent).append(cell);
  if(alreadyRevealed)return;
  const canvas=document.createElement("canvas");
  cell.append(canvas);
  const rect=cell.getBoundingClientRect();
  const scale=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(rect.width*scale)),h=Math.max(1,Math.round(rect.height*scale));
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");
  // Película metalizada dourada, estática durante a raspagem.
  const foil=ctx.createLinearGradient(0,0,w,h);
  foil.addColorStop(0,"#fff0ac");foil.addColorStop(.2,"#d4a250");
  foil.addColorStop(.41,"#f6df8c");foil.addColorStop(.61,"#a96d2b");
  foil.addColorStop(.8,"#fceab2");foil.addColorStop(1,"#bc873e");
  ctx.fillStyle=foil;ctx.fillRect(0,0,w,h);
  ctx.lineWidth=Math.max(1,scale*.7);
  ctx.strokeStyle="#fff8dd";ctx.globalAlpha=.24;
  for(let x=-h;x<w+h;x+=Math.max(11,w*.25)){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+h,h);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle="#8a571e";ctx.lineWidth=Math.max(1,scale);
  ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.40,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#573014";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor="#fff8cc";ctx.shadowBlur=2*scale;
  ctx.font="1000 "+Math.max(10,Math.round(w*.19))+"px system-ui";
  ctx.fillText("RASPA",w/2,h/2);
  ctx.shadowBlur=0;
  let active=false,last=null,travel=0;
  function xy(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*w,y:(e.clientY-r.top)/r.height*h}}
  function clear(from,to){
    ctx.globalCompositeOperation="destination-out";
    ctx.strokeStyle="#000";ctx.fillStyle="#000";
    ctx.lineWidth=Math.max(17,Math.min(w,h)*.47);
    ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();
    ctx.beginPath();ctx.arc(to.x,to.y,ctx.lineWidth*.5,0,Math.PI*2);ctx.fill();
  }
  function reveal(){
    if(!canvas.isConnected)return;
    canvas.remove();active=false;stopScratchSound();
    if(isWinner){cell.classList.add("revealed");flashWinningCell(cell);celebrateWinningTicket();}
    if(!state.ticket.revealed.includes(id))state.ticket.revealed.push(id);
    if(state.ticket.revealed.length===25)finish();
    else save();
  }
  canvas.addEventListener("pointerdown",e=>{
    if(e.cancelable)e.preventDefault();
    active=true;canvas.setPointerCapture(e.pointerId);
    last=xy(e);clear(last,last);startScratchSound();
  });
  canvas.addEventListener("pointermove",e=>{
    if(!active)return;
    if(e.cancelable)e.preventDefault();
    const now=xy(e),step=Math.hypot(now.x-last.x,now.y-last.y);
    if(step>0){clear(last,now);travel+=step;updateScratchSound(step);last=now}
    if(travel>Math.max(w*1.5,h*1.7))reveal();
  });
  for(const eventName of ["pointerup","pointercancel","lostpointercapture"]){
    canvas.addEventListener(eventName,()=>{active=false;stopScratchSound()});
  }
}
// Dispara o brilho também no botão "Raspar tudo", depois de desenhar o bilhete.
function flashWinningCell(cell){
  if(!cell)return;
  cell.classList.add("revealed");
  cell.classList.remove("flash-win");
  void cell.offsetWidth; // reinicia a animação mesmo se a classe já estava presente
  cell.classList.add("flash-win");
}
function render(){
  paintBalance();
  el("lucky").replaceChildren();el("play").replaceChildren();
  const ticket=state.ticket;
  if(!ticket){el("ticketid").textContent="PRONTO A JOGAR";return}
  el("ticketid").textContent="BILHETE Nº "+ticket.id;
  for(let i=0;i<5;i++)makeCell("lucky",ticket.lucky[i],"","l"+i,false,ticket.revealed.includes("l"+i));
  for(let i=0;i<20;i++){
    const winning=i===ticket.winAt;
    const amount=winning?ticket.prize:PRIZES[randomInt(5)].value;
    makeCell("play",ticket.play[i],money(amount),"p"+i,winning,ticket.revealed.includes("p"+i));
  }
  if(ticket.completed)status(ticket.prize?"Ganhaste "+eur(ticket.prize)+"!":"Bilhete sem prémio. Tenta novamente!");
}
function finish(){
  const ticket=state.ticket;
  if(!ticket || ticket.completed)return;
  ticket.completed=true;
  state.balance+=ticket.prize; // apenas uma vez, inclusive depois de recarregar a página
  save();paintBalance();
  status(ticket.prize?"🎉 GANHASTE "+eur(ticket.prize)+"!":"Bilhete sem prémio. Boa sorte no próximo!");
}
function revealAll(){
  if(!state.ticket || state.ticket.completed)return;
  stopScratchSound();
  state.ticket.revealed=Array.from({length:5},(_,i)=>"l"+i).concat(Array.from({length:20},(_,i)=>"p"+i));
  finish();render();
  // Após revelar tudo, realçar explicitamente o quadrado com o prémio.
  // Em bilhetes sem prémio, não se assinala nenhum quadrado como vencedor.
  const winner=el("play").querySelector(".cell.winning.revealed");
  flashWinningCell(winner);
  celebrateWinningTicket();
}

let celebrationTimeouts=[];
function playFireworksRecording(){if(!state.sound)return;const a=el("fireworks-audio");if(!a)return;try{a.pause();a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(_){}}
function stopFireworksRecording(){const a=el("fireworks-audio");if(a){a.pause();try{a.currentTime=0}catch(_){}}}
function fireworkSound(){const ac=ensureAudio();if(!ac)return;const now=ac.currentTime;const buffer=ac.createBuffer(1,Math.floor(ac.sampleRate*.65),ac.sampleRate);const d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*6);const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();src.buffer=buffer;filter.type="lowpass";filter.frequency.setValueAtTime(1700,now);filter.frequency.exponentialRampToValueAtTime(160,now+.55);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.27,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+.63);src.connect(filter);filter.connect(gain);gain.connect(ac.destination);src.start(now);src.stop(now+.65);}
el("celebration-close").addEventListener("click",clearCelebration);
function clearCelebration(){
  for(const timer of celebrationTimeouts)clearTimeout(timer);
  celebrationTimeouts=[];
  stopFireworksRecording();
  const overlay=el("celebration");
  if(overlay){overlay.hidden=true;overlay.setAttribute("aria-hidden","true")}
  el("fireworks-left").replaceChildren();
  el("fireworks-right").replaceChildren();
}
function launchFirework(container){
  const burst=document.createElement("div");
  burst.className="firework-core";
  container.append(burst);
  const spawned=[burst];
  const count=24;
  for(let i=0;i<count;i++){
    const angle=(2*Math.PI*i/count)+(Math.random()-.5)*.16;
    const radius=46+Math.random()*48;
    const particle=document.createElement("i");
    particle.className="firework-spark"+(i%2?" red":"");
    particle.style.setProperty("--x",(Math.cos(angle)*radius).toFixed(2)+"px");
    particle.style.setProperty("--y",(Math.sin(angle)*radius).toFixed(2)+"px");
    particle.style.animationDelay=(Math.random()*85)+"ms";
    container.append(particle);
    spawned.push(particle);
  }
  celebrationTimeouts.push(setTimeout(()=>{for(const piece of spawned)piece.remove()},1170));
}
function showCelebration(prizeCents){
  if(!Number.isFinite(prizeCents)||prizeCents<=0)return;
  clearCelebration();
  const overlay=el("celebration");
  el("celebration-amount").textContent=eur(prizeCents);
  overlay.hidden=false;
  overlay.setAttribute("aria-hidden","false");
  playFireworksRecording();
  // Quatro lançamentos sincronizados à esquerda e à direita do valor.
  for(let i=0;i<4;i++){
    celebrationTimeouts.push(setTimeout(()=>{
      launchFirework(el("fireworks-left"));
      launchFirework(el("fireworks-right"));
      // As explosões utilizam a gravação Fireworks.mp3.
    },i*850+130));
  }
  // A celebração permanece visível até o jogador tocar em Continuar.
}
function celebrateWinningTicket(){
  const t=state.ticket;
  if(!t||t.prize<=0||t.celebrated)return;
  t.celebrated=true; // impede celebrar novamente no mesmo bilhete
  save();
  showCelebration(t.prize);
}

function ensureAudio(){
  if(!state.sound)return null;
  try{
    if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended")audioContext.resume();
    return audioContext;
  }catch(_){return null}
}
function startScratchSound(){
  stopScratchSound();
  const ac=ensureAudio();
  if(!ac)return;
  // Som gerado localmente: ruído filtrado, semelhante ao atrito da moeda no cartão.
  const length=Math.floor(ac.sampleRate*.24),buffer=ac.createBuffer(1,length,ac.sampleRate);
  const data=buffer.getChannelData(0);
  let previous=0;
  for(let i=0;i<length;i++){const noise=(Math.random()*2-1);previous=.52*previous+.48*noise;data[i]=previous}
  const source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();
  source.buffer=buffer;source.loop=true;
  filter.type="bandpass";filter.frequency.value=1700;filter.Q.value=.48;
  gain.gain.value=.0001;
  source.connect(filter);filter.connect(gain);gain.connect(ac.destination);
  source.start();
  gain.gain.setTargetAtTime(.08,ac.currentTime,.023);
  scratchAudio={source,filter,gain,ac};
}
function updateScratchSound(step){
  if(!scratchAudio)return;
  const a=scratchAudio;
  a.filter.frequency.setTargetAtTime(1100+Math.random()*1800,a.ac.currentTime,.025);
  a.gain.gain.setTargetAtTime(Math.min(.17,.045+step/450),a.ac.currentTime,.018);
}
function stopScratchSound(){
  if(!scratchAudio)return;
  const a=scratchAudio;scratchAudio=null;
  a.gain.gain.setTargetAtTime(.0001,a.ac.currentTime,.015);
  try{a.source.stop(a.ac.currentTime+.09)}catch(_){}
}
el("new").addEventListener("click",buy);
el("reveal").addEventListener("click",revealAll);
el("sound").addEventListener("click",()=>{state.sound=!state.sound;stopScratchSound();save();paintBalance()});
["contextmenu","selectstart","dragstart","copy","cut"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
window.addEventListener("blur",stopScratchSound);
if(state.ticket){render();status(state.ticket.completed?(state.ticket.prize?"Ganhaste "+eur(state.ticket.prize)+"!":"Bilhete sem prémio."):"Continua a raspar o teu bilhete.");}
else{buy()}
</script>
</body>
</html>
