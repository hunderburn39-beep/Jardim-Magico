<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Raspadinha 100X - Teste</title><style>*{box-sizing:border-box}body{margin:0;background:#063a67;font-family:Arial;color:white;text-align:center}header{background:linear-gradient(120deg,#ed8e04,#ffda31,#f48b08);color:#16355b;padding:15px;font-size:30px;font-weight:900;text-shadow:1px 2px white}main{max-width:430px;margin:auto;padding:12px}.panel{background:#efad13;border:5px solid #fce369;border-radius:16px;padding:13px;color:#153967}h2{margin:10px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.cell{position:relative;background:#fff1a3;color:#133c64;border:2px solid #b87a13;border-radius:7px;min-height:62px;display:flex;flex-direction:column;justify-content:center;font-weight:900}.cell small{font-size:10px}.cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.controls{display:flex;gap:8px;justify-content:center;margin:12px}button{background:#ffd02a;color:#173c66;font-weight:bold;border:0;padding:13px;border-radius:9px}#status{padding:12px;background:#092a4b;border-radius:9px}footer{font-size:11px;opacity:.8;padding:12px}</style><header>100X O DINHEIRO</header><main><p id="saldo"></p><section class="panel"><h2>NÚMEROS DA SORTE</h2><div class="grid" id="lucky"></div><h2>OS TEUS NÚMEROS</h2><div class="grid" id="play"></div></section><div class="controls"><button onclick="novo()">Novo bilhete · 10 créditos</button><button onclick="revelar()">Raspar tudo</button></div><p id="status"></p><footer>Jogo recreativo não oficial com créditos virtuais. Protótipo online: não representa a distribuição oficial nem um cofre central.</footer></main><script>let saldo=100,cofre=0,restantes=0,ganho=0,canvasList=[],acertos=[];const $=id=>document.getElementById(id);function rand(n){return Math.floor(Math.random()*n)}function embaralhar(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function atualizar(){$('saldo').textContent='Saldo: '+saldo+' créditos'}function bloco(parent,n,p,win){let d=document.createElement('div');d.className='cell';d.innerHTML='<b>'+n+'</b>'+(p?'<small>'+p+' CR</small>':'');let cv=document.createElement('canvas');cv.width=140;cv.height=100;d.append(cv);$(parent).append(d);let ctx=cv.getContext('2d');ctx.fillStyle='#b3bcc4';ctx.fillRect(0,0,140,100);ctx.fillStyle='#53616b';ctx.font='bold 19px Arial';ctx.textAlign='center';ctx.fillText('RASPA',70,54);let down=false,steps=0;function erase(e){let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*140,y=(e.clientY-r.top)/r.height*100;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,21,0,7);ctx.fill();if(++steps>12)reveal()}function reveal(){if(!cv.isConnected)return;cv.remove();restantes--;if(!restantes){saldo+=ganho;atualizar();$('status').textContent=ganho?'Ganhaste '+ganho+' créditos!':'Bilhete sem prémio.'}}cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);erase(e)});cv.addEventListener('pointermove',e=>{if(down)erase(e)});cv.addEventListener('pointerup',()=>down=false);canvasList.push(reveal);restantes++}function novo(){if(saldo<10){$('status').textContent='Saldo insuficiente para novo bilhete.';return}saldo-=10;cofre+=6;atualizar();$('lucky').innerHTML='';$('play').innerHTML='';canvasList=[];restantes=0;ganho=0;let a=embaralhar(Array.from({length:70},(_,i)=>i+1)),l=a.slice(0,5),p=a.slice(5,25);let premios=[10,20,50,100,200,500];let possiveis=premios.filter(x=>x<=cofre);if(possiveis.length&&Math.random()<.3){ganho=possiveis[rand(possiveis.length)];p[rand(20)]=l[rand(5)];cofre-=ganho}for(let n of l)bloco('lucky',n,0,false);for(let n of p)bloco('play',n,l.includes(n)?ganho:10,l.includes(n));$('status').textContent='Raspa com o dedo para revelar os números.'}function revelar(){for(let fn of [...canvasList])fn()}atualizar();novo();</script></html>
